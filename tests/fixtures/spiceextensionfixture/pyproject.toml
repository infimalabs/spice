[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spice-extension-fixture"
version = "0.1.0"
description = "Third-party spice extension fixture for entry-point tests."
requires-python = ">=3.12"

[tool.setuptools]
py-modules = [
    "test_spiceextensiondriver",
    "test_spiceextensionstudy",
    "test_spiceextensionwrapper",
]

[tool.setuptools.package-dir]
"" = "src"

[project.entry-points."spice.drivers"]
toy = "test_spiceextensiondriver:TOY_DRIVER"
codex = "test_spiceextensiondriver:SHADOW_CODEX_DRIVER"

[project.entry-points."spice.studies"]
toy-study = "test_spiceextensionstudy:run_toy_study"
file-loc = "test_spiceextensionstudy:shadow_file_loc_study"

[project.entry-points."spice.wrappers"]
toy-wrapper = "test_spiceextensionwrapper:toy_wrapper_spec"
spice-dev = "test_spiceextensionwrapper:shadow_spice_dev_wrapper_spec"
