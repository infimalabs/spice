[package]
name = "proof"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
atomic = { path = "../atomic" }
gate = { path = "../gate" }
windows-execution = { path = "../windows" }
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.10.9"
toml = { version = "1.1.4", default-features = false, features = ["parse", "serde", "std"] }
sill = { path = "../sill" }
wire = { path = "../wire" }

# Hardware SHA-256 on aarch64; see wire/Cargo.toml.
[target.'cfg(all(target_arch = "aarch64", not(target_env = "msvc")))'.dependencies]
sha2 = { version = "0.10.9", features = ["asm"] }

[lints]
workspace = true
