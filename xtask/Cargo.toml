[package]
name = "xtask"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
atomic = { path = "../atomic" }
dist = { path = "../dist" }
rack = { path = "../rack", features = ["write", "link"] }
gate = { path = "../gate" }
flate2.workspace = true
getrandom = "0.3.4"
windows-execution = { path = "../windows" }
proof = { path = "../proof" }
prepared-artifact = { path = "../prepared", features = ["windows-proof"] }
jiff = "0.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
shell-words = "1.1.1"
sha2 = "0.10.9"
sill = { path = "../sill" }
tar = "0.4.44"
spice = { path = "../spice" }
toml = "1.1.4"
wire = { path = "../wire" }
zip = { version = "9.3", default-features = false }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
signal-hook = "0.3.18"

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

# Hardware SHA-256 on aarch64; see wire/Cargo.toml.
[target.'cfg(all(target_arch = "aarch64", not(target_env = "msvc")))'.dependencies]
sha2 = { version = "0.10.9", features = ["asm"] }

[dev-dependencies]
test-support = { path = "../test-support" }

[lints]
workspace = true
