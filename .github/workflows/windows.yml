name: Spice hosted Windows execution

on:
  workflow_dispatch:
    inputs:
      request:
        description: Canonical Spice hosted-execution request JSON
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  execute:
    name: Disposable x86-64 Windows execution
    runs-on: windows-2025
    timeout-minutes: 75
    steps:
      - name: Check out exact source ref
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Materialize request
        id: request
        shell: pwsh
        env:
          SPICE_HOSTED_REQUEST: ${{ inputs.request }}
        run: |
          $requestPath = Join-Path $env:RUNNER_TEMP 'request.json'
          [IO.File]::WriteAllText(
            $requestPath,
            $env:SPICE_HOSTED_REQUEST,
            [Text.UTF8Encoding]::new($false)
          )
          $request = Get-Content -Raw -LiteralPath $requestPath | ConvertFrom-Json
          "challenge=$($request.challenge)" >> $env:GITHUB_OUTPUT

      - name: Install exact Rust and release tools
        shell: pwsh
        run: |
          $rustup = "$env:USERPROFILE\.cargo\bin\rustup.exe"
          & $rustup toolchain install 1.97.1-x86_64-pc-windows-msvc --profile minimal --no-self-update
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $rustup target add --toolchain 1.97.1-x86_64-pc-windows-msvc wasm32-unknown-unknown
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $ProgressPreference = 'SilentlyContinue'
          $tools = 'C:\spice-hosted-tools\bin'
          $tar = "$env:SystemRoot\System32\tar.exe"
          New-Item -ItemType Directory -Force -Path $tools | Out-Null

          function Get-CheckedArchive {
            param([string] $Name, [string] $Uri, [string] $Sha256)
            $archive = Join-Path $env:RUNNER_TEMP $Name
            Invoke-WebRequest -Uri $Uri -OutFile $archive
            $observed = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($observed -ne $Sha256) {
              throw "$Name drifted: expected $Sha256, observed $observed"
            }
            return $archive
          }

          $trunkArchive = Get-CheckedArchive `
            'trunk-x86_64-pc-windows-msvc.zip' `
            'https://github.com/trunk-rs/trunk/releases/download/v0.22.1/trunk-x86_64-pc-windows-msvc.zip' `
            '1cc65012a9df60b02db948f5a3f0601e594ce952efb1cfd23147c9021c9f7d75'
          Expand-Archive -LiteralPath $trunkArchive -DestinationPath $tools -Force
          Remove-Item -Force -LiteralPath $trunkArchive

          $bindgenArchive = Get-CheckedArchive `
            'wasm-bindgen-0.2.126-x86_64-pc-windows-msvc.tar.gz' `
            'https://github.com/wasm-bindgen/wasm-bindgen/releases/download/0.2.126/wasm-bindgen-0.2.126-x86_64-pc-windows-msvc.tar.gz' `
            '5a3773c7e69cfb2d865e235e9210de184c8c3af1787720646ec1a8bbe09c6179'
          $bindgenExtract = Join-Path $env:RUNNER_TEMP 'wasm-bindgen'
          New-Item -ItemType Directory -Force -Path $bindgenExtract | Out-Null
          & $tar -xzf $bindgenArchive -C $bindgenExtract
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item `
            (Join-Path $bindgenExtract 'wasm-bindgen-0.2.126-x86_64-pc-windows-msvc\wasm-bindgen.exe') `
            (Join-Path $tools 'wasm-bindgen.exe')
          Remove-Item -Recurse -Force -LiteralPath $bindgenExtract, $bindgenArchive

          $binaryenArchive = Get-CheckedArchive `
            'binaryen-version_131-x86_64-windows.tar.gz' `
            'https://github.com/WebAssembly/binaryen/releases/download/version_131/binaryen-version_131-x86_64-windows.tar.gz' `
            '2f4edac1703a2f695254d6ff52ede03481e67db1f094915763d863158c17d9bc'
          $binaryenExtract = Join-Path $env:RUNNER_TEMP 'binaryen'
          New-Item -ItemType Directory -Force -Path $binaryenExtract | Out-Null
          & $tar -xzf $binaryenArchive -C $binaryenExtract
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item `
            (Join-Path $binaryenExtract 'binaryen-version_131\bin\wasm-opt.exe') `
            (Join-Path $tools 'wasm-opt.exe')
          Remove-Item -Recurse -Force -LiteralPath $binaryenExtract, $binaryenArchive

          $admissions = @(
            @{
              Path = Join-Path $tools 'trunk.exe'
              Expected = 'trunk 0.22.1'
            }
            @{
              Path = Join-Path $tools 'wasm-bindgen.exe'
              Expected = 'wasm-bindgen 0.2.126'
            }
            @{
              Path = Join-Path $tools 'wasm-opt.exe'
              Expected = 'wasm-opt version 131 (version_131)'
            }
          )
          foreach ($admission in $admissions) {
            $observed = (& $admission.Path --version | Out-String).Trim()
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            if ($observed -ne $admission.Expected) {
              throw "$($admission.Path) drifted: expected $($admission.Expected), observed $observed"
            }
          }
      - name: Build repository-owned runner
        shell: pwsh
        env:
          CARGO_HOME: ${{ runner.temp }}\bootstrap-cargo
          RUSTC: C:\Users\runneradmin\.rustup\toolchains\1.97.1-x86_64-pc-windows-msvc\bin\rustc.exe
          RUSTUP_TOOLCHAIN: 1.97.1-x86_64-pc-windows-msvc
          CARGO_TARGET_DIR: ${{ runner.temp }}\bootstrap-target
        run: |
          $cargo = "$env:USERPROFILE\.rustup\toolchains\1.97.1-x86_64-pc-windows-msvc\bin\cargo.exe"
          & $cargo build --locked --release --package windows-execution --bin windows-hosted
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $cargo vendor --locked --versioned-dirs "$env:RUNNER_TEMP\vendor" | Out-Null
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Execute sealed request
        shell: pwsh
        env:
          SPICE_HOSTED_VENDOR: ${{ runner.temp }}\vendor
        run: |
          $runner = Join-Path $env:RUNNER_TEMP 'bootstrap-target\release\windows-hosted.exe'
          $request = Join-Path $env:RUNNER_TEMP 'request.json'
          $result = Join-Path $env:RUNNER_TEMP 'result.json'
          & $runner $request $result
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Sign repository-owned runner
        uses: actions/attest-build-provenance@62fc1d596301d0ab9914e1fec14dc5c8d93f65cd
        with:
          subject-path: ${{ runner.temp }}\bootstrap-target\release\windows-hosted.exe

      - name: Sign result with GitHub OIDC identity
        uses: actions/attest-build-provenance@62fc1d596301d0ab9914e1fec14dc5c8d93f65cd
        with:
          subject-path: ${{ runner.temp }}\result.json

      - name: Publish immutable result, runner, and staged output
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: spice-hosted-${{ steps.request.outputs.challenge }}
          path: |
            ${{ runner.temp }}\result.json
            ${{ runner.temp }}\bootstrap-target\release\windows-hosted.exe
            ${{ runner.temp }}\spice-hosted-stage-${{ steps.request.outputs.challenge }}
          if-no-files-found: error
          retention-days: 1

      - name: Tear down disposable files
        if: always()
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue "$env:RUNNER_TEMP\bootstrap-cargo"
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue "$env:RUNNER_TEMP\bootstrap-target"
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue "$env:RUNNER_TEMP\vendor"
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue "$env:RUNNER_TEMP\spice-hosted-*"
          Remove-Item -Force -ErrorAction SilentlyContinue "$env:RUNNER_TEMP\request.json"
          Remove-Item -Force -ErrorAction SilentlyContinue "$env:RUNNER_TEMP\result.json"

      - name: Retire one-use source ref
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $sourceRef = $env:GITHUB_REF_NAME
          if ($env:GITHUB_REF_TYPE -ne 'tag' -or -not $sourceRef.StartsWith('spice-hosted-')) {
            throw "refusing to retire non-hosted source ref $env:GITHUB_REF"
          }
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = "application/vnd.github+json"
            'X-GitHub-Api-Version' = "2022-11-28"
          }
          $uri = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/git/refs/tags/$sourceRef"
          try {
            Invoke-RestMethod -Method Delete -Uri $uri -Headers $headers -TimeoutSec 30 | Out-Null
          } catch {
            $deleteError = $_
            $missing = $false
            try {
              Invoke-RestMethod -Method Get -Uri $uri -Headers $headers -TimeoutSec 30 | Out-Null
            } catch {
              if ([int]$_.Exception.Response.StatusCode -eq 404) {
                $missing = $true
              } else {
                throw
              }
            }
            if (-not $missing) { throw $deleteError }
          }
