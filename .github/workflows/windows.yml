name: Windows staging
run-name: Windows staging ${{ inputs.challenge }}

on:
  workflow_dispatch:
    inputs:
      challenge:
        description: Unique lowercase 64-hex execution challenge
        required: true
        type: string
      request:
        description: Canonical hosted-execution request JSON
        required: true
        type: string

permissions:
  actions: read
  contents: write
  id-token: write
  attestations: write
  packages: write

jobs:
  stage:
    name: Stage Windows
    runs-on: windows-2025
    timeout-minutes: 75
    steps:
      - name: Admit request envelope
        id: request
        shell: pwsh
        env:
          SPICE_HOSTED_CHALLENGE: ${{ inputs.challenge }}
          SPICE_HOSTED_REQUEST: ${{ inputs.request }}
        run: |
          $ErrorActionPreference = 'Stop'
          $requestPath = Join-Path $env:RUNNER_TEMP 'request.json'
          [IO.File]::WriteAllText($requestPath, $env:SPICE_HOSTED_REQUEST, [Text.UTF8Encoding]::new($false))
          $request = Get-Content -Raw -LiteralPath $requestPath | ConvertFrom-Json
          if ($request.challenge -cne $env:SPICE_HOSTED_CHALLENGE) { throw 'challenge input drifted' }
          if ($request.workflow_ref -cne 'refs/heads/main' -or $env:GITHUB_REF -cne 'refs/heads/main') {
            throw "workflow ref drifted: $env:GITHUB_REF"
          }
          "challenge=$($request.challenge)" >> $env:GITHUB_OUTPUT
          if ($null -ne $request.release_inputs) {
            "release_inputs_run=$($request.release_inputs.run_id)" >> $env:GITHUB_OUTPUT
            "release_inputs_challenge=$($request.release_inputs.challenge)" >> $env:GITHUB_OUTPUT
          } elseif ($null -ne $request.canvas) {
            "canvas=$($request.canvas.digest)" >> $env:GITHUB_OUTPUT
            "linux_run=$($request.canvas.run_id)" >> $env:GITHUB_OUTPUT
          }

      - name: Download input
        if: steps.request.outputs.release_inputs_run != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: input-${{ steps.request.outputs.release_inputs_challenge }}
          run-id: ${{ steps.request.outputs.release_inputs_run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}\input-${{ steps.request.outputs.release_inputs_challenge }}

      - name: Admit canonical source delivery
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $request = Get-Content -Raw -LiteralPath (Join-Path $env:RUNNER_TEMP 'request.json') | ConvertFrom-Json
          if ($request.source_commit -cnotmatch '^[0-9a-f]{40}$' -or
              $request.archive_sha256 -cnotmatch '^[0-9a-f]{64}$' -or
              $request.tree -cnotmatch '^[0-9a-f]{64}$') {
            throw 'source request is malformed'
          }
          $archive = Join-Path $env:RUNNER_TEMP 'source.tar'
          if ($null -ne $request.release_inputs) {
            $root = Join-Path $env:RUNNER_TEMP "input-$($request.release_inputs.challenge)"
            $result = Get-Content -Raw -LiteralPath (Join-Path $root 'result.json') | ConvertFrom-Json
            if ([uint64]$result.run_id -ne [uint64]$request.release_inputs.run_id -or
                $result.challenge -cne $request.release_inputs.challenge -or
                $result.source_commit -cne $request.source_commit -or
                $result.source -cne $request.source -or
                $result.archive_sha256 -cne $request.archive_sha256 -or
                $result.tree -cne $request.tree -or
                $result.app -cne $request.release_inputs.app -or
                $result.canvas -cne $request.release_inputs.canvas -or
                $result.proof_build_key -cne $request.release_inputs.proof_build_key -or
                $result.proof_manifest -cne $request.release_inputs.proof_manifest -or
                $result.proof_identity -cne $request.release_inputs.proof_identity -or
                $result.workflow_sha -cne $request.release_inputs.workflow_sha) {
              throw 'release input result differs from request'
            }
            Copy-Item -LiteralPath (Join-Path $root 'source.tar') -Destination $archive
          } else {
            if ([uint64]$request.transport_asset -eq 0) { throw 'source transport request is malformed' }
            $headers = @{
              Authorization = "Bearer $env:GH_TOKEN"
              Accept = 'application/octet-stream'
              'X-GitHub-Api-Version' = '2022-11-28'
            }
            $uri = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/assets/$($request.transport_asset)"
            Invoke-WebRequest -Uri $uri -Headers $headers -OutFile $archive
          }
          $observed = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($observed -cne $request.archive_sha256) {
            throw "source archive drifted: expected $($request.archive_sha256), observed $observed"
          }
          Get-ChildItem -Force -LiteralPath $env:GITHUB_WORKSPACE | Remove-Item -Recurse -Force
          # Extraction stamps sources with the current time rather than the
          # commit time, so a restored bootstrap target never mistakes them for
          # older than a previous commit's build.
          & "$env:SystemRoot\System32\tar.exe" -xmf $archive --strip-components=1 -C $env:GITHUB_WORKSPACE
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $record = Get-Content -Raw -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'dist\build.json') | ConvertFrom-Json
          if ($record.source.commit -cne $request.source_commit) { throw 'canonical source commit drifted' }
          git init -q
          git config core.autocrlf false
          git config user.name spice-hosted
          git config user.email hosted@invalid
          git add -A -f -- .
          @'
          from pathlib import PurePosixPath
          import subprocess
          import sys
          import tarfile

          executable = []
          with tarfile.open(sys.argv[1], "r:") as source:
              for member in source:
                  path = PurePosixPath(member.name)
                  if path.is_absolute() or ".." in path.parts or not path.parts or path.parts[0] != "spice":
                      raise SystemExit(f"invalid source archive path: {member.name}")
                  if member.isfile() and member.mode & 0o111:
                      relative = PurePosixPath(*path.parts[1:])
                      if not relative.parts:
                          raise SystemExit(f"invalid executable source path: {member.name}")
                      executable.append(relative.as_posix())
          if executable:
              subprocess.run(
                  ["git", "update-index", "--chmod=+x", "--", *executable],
                  check=True,
              )
          '@ | python - $archive
          git commit -q -m "canonical source $($request.source_commit)"
          $tree = python -c "import hashlib,subprocess; print(hashlib.sha256(subprocess.check_output(['git','ls-tree','-r','-z','--full-tree','HEAD'])).hexdigest())"
          if ($tree.Trim() -cne $request.tree) { throw "canonical source tree drifted: $tree" }

      - name: Download staged Linux canvas
        if: steps.request.outputs.canvas != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: canvas-${{ steps.request.outputs.canvas }}
          run-id: ${{ steps.request.outputs.linux_run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}\linux-stage-${{ steps.request.outputs.challenge }}

      - name: Install exact Rust and release tools
        shell: pwsh
        run: |
          $rustup = "$env:USERPROFILE\.cargo\bin\rustup.exe"
          & $rustup toolchain install 1.97.1-x86_64-pc-windows-msvc --profile minimal --no-self-update
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $rustup target add --toolchain 1.97.1-x86_64-pc-windows-msvc wasm32-unknown-unknown
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $ProgressPreference = 'SilentlyContinue'
          $tools = 'C:\hosted-tools\bin'
          $tar = "$env:SystemRoot\System32\tar.exe"
          New-Item -ItemType Directory -Force -Path $tools | Out-Null

          function Get-CheckedArchive {
            param([string] $Name, [string] $Uri, [string] $Sha256)
            $archive = Join-Path $env:RUNNER_TEMP $Name
            Invoke-WebRequest -Uri $Uri -OutFile $archive
            $observed = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($observed -ne $Sha256) { throw "$Name drifted: expected $Sha256, observed $observed" }
            return $archive
          }

          $trunkArchive = Get-CheckedArchive `
            'trunk-x86_64-pc-windows-msvc.zip' `
            'https://github.com/trunk-rs/trunk/releases/download/v0.22.1/trunk-x86_64-pc-windows-msvc.zip' `
            '1cc65012a9df60b02db948f5a3f0601e594ce952efb1cfd23147c9021c9f7d75'
          Expand-Archive -LiteralPath $trunkArchive -DestinationPath $tools -Force
          Remove-Item -Force -LiteralPath $trunkArchive

          $bindgenArchive = Get-CheckedArchive `
            'wasm-bindgen-0.2.126-x86_64-pc-windows-msvc.tar.gz' `
            'https://github.com/wasm-bindgen/wasm-bindgen/releases/download/0.2.126/wasm-bindgen-0.2.126-x86_64-pc-windows-msvc.tar.gz' `
            '5a3773c7e69cfb2d865e235e9210de184c8c3af1787720646ec1a8bbe09c6179'
          $bindgenExtract = Join-Path $env:RUNNER_TEMP 'wasm-bindgen'
          New-Item -ItemType Directory -Force -Path $bindgenExtract | Out-Null
          & $tar -xzf $bindgenArchive -C $bindgenExtract
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item (Join-Path $bindgenExtract 'wasm-bindgen-0.2.126-x86_64-pc-windows-msvc\wasm-bindgen.exe') (Join-Path $tools 'wasm-bindgen.exe')
          Remove-Item -Recurse -Force -LiteralPath $bindgenExtract, $bindgenArchive

          $binaryenArchive = Get-CheckedArchive `
            'binaryen-version_131-x86_64-windows.tar.gz' `
            'https://github.com/WebAssembly/binaryen/releases/download/version_131/binaryen-version_131-x86_64-windows.tar.gz' `
            '2f4edac1703a2f695254d6ff52ede03481e67db1f094915763d863158c17d9bc'
          $binaryenExtract = Join-Path $env:RUNNER_TEMP 'binaryen'
          New-Item -ItemType Directory -Force -Path $binaryenExtract | Out-Null
          & $tar -xzf $binaryenArchive -C $binaryenExtract
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item (Join-Path $binaryenExtract 'binaryen-version_131\bin\wasm-opt.exe') (Join-Path $tools 'wasm-opt.exe')
          Remove-Item -Recurse -Force -LiteralPath $binaryenExtract, $binaryenArchive

          $admissions = @(
            @{ Path = Join-Path $tools 'trunk.exe'; Expected = 'trunk 0.22.1' }
            @{ Path = Join-Path $tools 'wasm-bindgen.exe'; Expected = 'wasm-bindgen 0.2.126' }
            @{ Path = Join-Path $tools 'wasm-opt.exe'; Expected = 'wasm-opt version 131 (version_131)' }
          )
          foreach ($admission in $admissions) {
            $observed = (& $admission.Path --version | Out-String).Trim()
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            if ($observed -ne $admission.Expected) {
              throw "$($admission.Path) drifted: expected $($admission.Expected), observed $observed"
            }
          }

      - name: Restore derivable bootstrap environment
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: |
            ${{ runner.temp }}\bootstrap-cargo
            ${{ runner.temp }}\bootstrap-target
          key: windows-bootstrap-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', '.cargo/config.toml', 'dist/windows/hosted.toml') }}

      - name: Build repository-owned runner
        shell: pwsh
        env:
          CARGO_HOME: ${{ runner.temp }}\bootstrap-cargo
          RUSTC: C:\Users\runneradmin\.rustup\toolchains\1.97.1-x86_64-pc-windows-msvc\bin\rustc.exe
          RUSTUP_TOOLCHAIN: 1.97.1-x86_64-pc-windows-msvc
          CARGO_TARGET_DIR: ${{ runner.temp }}\bootstrap-target
        run: |
          $cargo = "$env:USERPROFILE\.rustup\toolchains\1.97.1-x86_64-pc-windows-msvc\bin\cargo.exe"
          & $cargo build --locked --release --package windows-execution --bin windows-hosted
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $cargo build --locked --release --package xtask --bin xtask
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $cargo vendor --locked --versioned-dirs "$env:RUNNER_TEMP\vendor" | Out-Null
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install exact ORAS
        uses: oras-project/setup-oras@ac735097e22fe643015b0d19645f7c9a69942128
        with:
          version: 1.3.0

      - name: Execute sealed request
        shell: pwsh
        env:
          SPICE_HOSTED_VENDOR: ${{ runner.temp }}\vendor
        run: |
          $runner = Join-Path $env:RUNNER_TEMP 'bootstrap-target\release\windows-hosted.exe'
          $request = Join-Path $env:RUNNER_TEMP 'request.json'
          $result = Join-Path $env:RUNNER_TEMP 'result.json'
          $archive = Join-Path $env:RUNNER_TEMP 'source.tar'
          & $runner $request $result $archive
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Assemble complete hosted artifact
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'result'
          $stage = Join-Path $env:RUNNER_TEMP 'windows-stage-${{ steps.request.outputs.challenge }}'
          New-Item -ItemType Directory -Force $root | Out-Null
          New-Item -ItemType Directory -Force (Join-Path $root 'runner') | Out-Null
          Copy-Item -Force (Join-Path $env:RUNNER_TEMP 'result.json') (Join-Path $root 'result.json')
          Copy-Item -Force (Join-Path $env:RUNNER_TEMP 'bootstrap-target\release\windows-hosted.exe') (Join-Path $root 'runner\windows-hosted.exe')
          if (Test-Path -LiteralPath $stage) {
            Copy-Item -Recurse -Force -LiteralPath $stage -Destination (Join-Path $root 'stage')
          }
          $files = [string[]]@(Get-ChildItem -LiteralPath $root -Recurse -File -Force |
            ForEach-Object { [IO.Path]::GetRelativePath($root, $_.FullName).Replace('\', '/') } |
            Where-Object { $_ -cne 'subjects.json' })
          [Array]::Sort($files, [StringComparer]::Ordinal)
          [IO.File]::WriteAllText((Join-Path $root 'subjects.json'), (ConvertTo-Json -Compress -InputObject $files))

      - name: Attest complete hosted artifact
        uses: actions/attest-build-provenance@62fc1d596301d0ab9914e1fec14dc5c8d93f65cd
        with:
          subject-path: ${{ runner.temp }}/result/**

      - name: Publish finalized Windows bundle
        shell: pwsh
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'result'
          $request = Get-Content -Raw -LiteralPath (Join-Path $env:RUNNER_TEMP 'request.json') | ConvertFrom-Json
          $prepared = Join-Path $env:RUNNER_TEMP 'prepared'
          New-Item -ItemType Directory -Force $prepared | Out-Null
          $key = Join-Path $prepared 'build-key.json'
          [IO.File]::WriteAllText(
            $key,
            (ConvertTo-Json -Compress -InputObject $request.prepared_bundle.inputs),
            [Text.UTF8Encoding]::new($false)
          )
          $xtask = Join-Path $env:RUNNER_TEMP 'bootstrap-target\release\xtask.exe'
          $archive = Join-Path $prepared 'windows-stage.tar.gz'
          & $xtask prepared-artifact pack $root $archive
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $manifest = Join-Path $prepared 'prepared.json'
          & $xtask prepared-artifact manifest bundle windows-amd64 $key application/gzip `
            $archive $root - $manifest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $tag = $request.prepared_bundle.build_key.Substring(7)
          $env:GHCR_TOKEN | oras login ghcr.io --username $env:GITHUB_ACTOR --password-stdin
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $xtask prepared-artifact publish `
            "ghcr.io/$($env:GITHUB_REPOSITORY.ToLowerInvariant())/prepared" `
            $tag $manifest $archive
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          oras logout ghcr.io

      - name: Tear down disposable files
        if: always()
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue "$env:RUNNER_TEMP\vendor"
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue "$env:RUNNER_TEMP\windows-stage-*"
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue "$env:RUNNER_TEMP\windows-${{ inputs.challenge }}"
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue "$env:RUNNER_TEMP\linux-stage-*"
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue "$env:RUNNER_TEMP\input-*"
          Remove-Item -Force -ErrorAction SilentlyContinue "$env:RUNNER_TEMP\request.json"
          Remove-Item -Force -ErrorAction SilentlyContinue "$env:RUNNER_TEMP\result.json"
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue "$env:RUNNER_TEMP\result"
          Remove-Item -Force -ErrorAction SilentlyContinue "$env:RUNNER_TEMP\source.tar"
