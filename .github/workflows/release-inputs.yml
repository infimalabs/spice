name: Release inputs
run-name: Release inputs ${{ inputs.challenge }}

on:
  workflow_dispatch:
    inputs:
      challenge:
        description: Unique lowercase 64-hex release-input challenge
        required: true
        type: string
      source_commit:
        description: Exact landed main commit to archive and compile
        required: true
        type: string

permissions: {}

jobs:
  produce:
    name: Build canonical archive and canvas
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Check out exact landed source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.source_commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Admit request and landed commit
        env:
          CHALLENGE: ${{ inputs.challenge }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          set -euo pipefail
          [[ "$CHALLENGE" =~ ^[0-9a-f]{64}$ ]]
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$GITHUB_REF" == refs/heads/main ]]
          [[ "$(git rev-parse HEAD)" == "$SOURCE_COMMIT" ]]
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor "$SOURCE_COMMIT" refs/remotes/origin/main
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      # Derivable bootstrap state only: the pinned app compiler, registry
      # sources, and the debug xtask target. Every hit is re-admitted below by
      # the exact trunk version and Cargo's own freshness checks; release
      # outputs are never cached.
      - name: Restore derivable bootstrap environment
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: |
            ${{ runner.temp }}/bootstrap-cargo
            ${{ runner.temp }}/bootstrap-target
          key: release-inputs-bootstrap-${{ runner.os }}-${{ runner.arch }}-trunk-0.22.1-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', '.cargo/config.toml') }}

      - name: Install exact Rust and app compiler
        env:
          CARGO_HOME: ${{ runner.temp }}/bootstrap-cargo
        run: |
          set -euo pipefail
          rustup toolchain install --no-self-update
          cargo install --locked trunk --version 0.22.1
          test "$("$CARGO_HOME/bin/trunk" --version)" = "trunk 0.22.1"
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"

      - name: Build repository-owned producer
        env:
          CARGO_HOME: ${{ runner.temp }}/bootstrap-cargo
          CARGO_TARGET_DIR: ${{ runner.temp }}/bootstrap-target
        run: cargo build --locked --package xtask

      - name: Build canonical source archive and app canvas
        env:
          CARGO_HOME: ${{ runner.temp }}/bootstrap-cargo
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/bootstrap-target/debug/xtask" release-inputs \
            "$RUNNER_TEMP/release-inputs"

      # The archive is keyed by every proof-image build input. A hit is loaded,
      # which re-admits its checksum sidecar, the loaded image ID, and the
      # vendor set of this Cargo.lock; a refused hit is discarded and rebuilt.
      - name: Restore shared proof image archive
        id: proof-cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: ${{ runner.temp }}/proof-image
          key: proof-image-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('dist/proof-image/**', 'Cargo.lock', '.cargo/config.toml', 'xtask/src/proof_image.rs') }}

      - name: Build shared proof image archive
        id: proof
        env:
          CARGO_HOME: ${{ runner.temp }}/bootstrap-cargo
          CACHE_HIT: ${{ steps.proof-cache.outputs.cache-hit }}
        run: |
          set -euo pipefail
          xtask="$RUNNER_TEMP/bootstrap-target/debug/xtask"
          archive="$RUNNER_TEMP/proof-image/proof-image.tar"
          identity=
          if [[ "$CACHE_HIT" == true ]] \
            && "$xtask" proof-image load "$archive" | tee "$RUNNER_TEMP/proof-image.out"; then
            identity="$(sed -n 's/^loaded proof image //p' "$RUNNER_TEMP/proof-image.out")"
            test "$identity" = "$(cat "$archive.identity")"
          else
            rm -rf "$RUNNER_TEMP/proof-image"
            mkdir "$RUNNER_TEMP/proof-image"
            "$xtask" proof-image build "$archive" | tee "$RUNNER_TEMP/proof-image.out"
            identity="$(sed -n 's/^proof image //p' "$RUNNER_TEMP/proof-image.out")"
          fi
          [[ "$identity" =~ ^sha256:[0-9a-f]{64}$ ]]
          checksum="$(sha256sum "$archive" | cut -d' ' -f1)"
          echo "identity=$identity" >> "$GITHUB_OUTPUT"
          echo "archive_sha256=$checksum" >> "$GITHUB_OUTPUT"

      - name: Record immutable producer result
        env:
          CHALLENGE: ${{ inputs.challenge }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          PROOF_IDENTITY: ${{ steps.proof.outputs.identity }}
          PROOF_ARCHIVE_SHA256: ${{ steps.proof.outputs.archive_sha256 }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/release-inputs"
          archive_tree="$RUNNER_TEMP/archive-tree"
          mkdir "$archive_tree"
          tar -xf "$root/source.tar" -C "$archive_tree"
          git -C "$archive_tree/spice" init -q
          git -C "$archive_tree/spice" config core.autocrlf false
          git -C "$archive_tree/spice" add -A -f -- .
          tree_id="$(git -C "$archive_tree/spice" write-tree)"
          tree="$(git -C "$archive_tree/spice" ls-tree -r -z --full-tree "$tree_id" | sha256sum | cut -d' ' -f1)"
          jq \
            --arg challenge "$CHALLENGE" \
            --arg source_commit "$SOURCE_COMMIT" \
            --arg tree "$tree" \
            --arg proof_identity "$PROOF_IDENTITY" \
            --arg proof_archive_sha256 "$PROOF_ARCHIVE_SHA256" \
            --arg workflow ".github/workflows/release-inputs.yml" \
            --arg workflow_ref "$GITHUB_WORKFLOW_REF" \
            --arg workflow_sha "$GITHUB_WORKFLOW_SHA" \
            --argjson run_id "$GITHUB_RUN_ID" \
            --arg image_os "$ImageOS" \
            --arg image_version "$ImageVersion" \
            --arg architecture "$RUNNER_ARCH" \
            --arg rustc "$(rustc --version)" \
            --arg cargo "$(cargo --version)" \
            --arg trunk "$(trunk --version)" \
            '. + {
              challenge: $challenge,
              source_commit: $source_commit,
              tree: $tree,
              proof_identity: $proof_identity,
              proof_archive_sha256: $proof_archive_sha256,
              workflow: $workflow,
              workflow_ref: $workflow_ref,
              workflow_sha: $workflow_sha,
              run_id: $run_id,
              runner: {image_os: $image_os, image_version: $image_version, architecture: $architecture},
              toolchain: {rustc: $rustc, cargo: $cargo, trunk: $trunk}
            }' "$root/producer.json" > "$root/result.json"
          test "$(jq -r .source_commit "$root/result.json")" = "$SOURCE_COMMIT"
          rm "$root/producer.json"

      - name: Publish canonical release inputs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-inputs-${{ inputs.challenge }}
          path: |
            ${{ runner.temp }}/release-inputs/source.tar
            ${{ runner.temp }}/release-inputs/canvas.zip
            ${{ runner.temp }}/release-inputs/result.json
          if-no-files-found: error
          retention-days: 7

      - name: Publish shared proof image archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: proof-image-${{ inputs.challenge }}
          path: |
            ${{ runner.temp }}/proof-image/proof-image.tar
            ${{ runner.temp }}/proof-image/proof-image.tar.sha256
            ${{ runner.temp }}/proof-image/proof-image.tar.identity
          if-no-files-found: error
          retention-days: 7

  attest:
    name: Sign canonical release inputs
    needs: produce
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      attestations: write
      id-token: write
    steps:
      - name: Download canonical release inputs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-inputs-${{ inputs.challenge }}
          path: ${{ runner.temp }}/release-inputs

      - name: Attest archive, canvas, and producer result
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a
        with:
          subject-path: |
            ${{ runner.temp }}/release-inputs/source.tar
            ${{ runner.temp }}/release-inputs/canvas.zip
            ${{ runner.temp }}/release-inputs/result.json
