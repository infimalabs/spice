name: Linux staging
run-name: Linux staging ${{ inputs.challenge }}

on:
  workflow_dispatch:
    inputs:
      challenge:
        description: Unique lowercase 64-hex execution challenge
        required: true
        type: string
      source_commit:
        description: Canonical source commit recorded by source.tar
        required: true
        type: string
      source:
        description: Canonical source-archive identity
        required: true
        type: string
      archive_sha256:
        description: Raw SHA-256 of source.tar
        required: true
        type: string
      release_inputs_run:
        description: Provider run that produced the canonical release inputs
        required: true
        type: string
      release_inputs_challenge:
        description: Challenge naming the canonical release-input artifact
        required: true
        type: string
      app:
        description: Canonical app generation
        required: true
        type: string
      canvas:
        description: Canonical app canvas identity
        required: true
        type: string
      proof_build_key:
        description: Complete prepared proof-image build key
        required: true
        type: string
      proof_manifest:
        description: Immutable prepared proof-image OCI manifest
        required: true
        type: string
      proof_identity:
        description: Shared proof image identity
        required: true
        type: string
      tree:
        description: Exact canonical source tree digest
        required: true
        type: string

permissions: {}

jobs:
  stage:
    name: Stage Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      actions: read
      packages: write
    steps:
      - name: Download input
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: input-${{ inputs.release_inputs_challenge }}
          run-id: ${{ inputs.release_inputs_run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/input


      - name: Install exact ORAS
        uses: oras-project/setup-oras@ac735097e22fe643015b0d19645f7c9a69942128
        with:
          version: 1.3.0
      - name: Admit runner and canonical release inputs
        env:
          CHALLENGE: ${{ inputs.challenge }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          SOURCE: ${{ inputs.source }}
          ARCHIVE_SHA256: ${{ inputs.archive_sha256 }}
          INPUTS_RUN: ${{ inputs.release_inputs_run }}
          INPUTS_CHALLENGE: ${{ inputs.release_inputs_challenge }}
          APP: ${{ inputs.app }}
          CANVAS: ${{ inputs.canvas }}
          PROOF_BUILD_KEY: ${{ inputs.proof_build_key }}
          PROOF_MANIFEST: ${{ inputs.proof_manifest }}
          PROOF_IDENTITY: ${{ inputs.proof_identity }}
          TREE: ${{ inputs.tree }}
        run: |
          set -euo pipefail
          [[ "$CHALLENGE" =~ ^[0-9a-f]{64}$ ]]
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SOURCE" =~ ^[0-9a-f]{64}$ ]]
          [[ "$ARCHIVE_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$INPUTS_RUN" =~ ^[1-9][0-9]*$ ]]
          [[ "$INPUTS_CHALLENGE" =~ ^[0-9a-f]{64}$ ]]
          [[ "$APP" =~ ^[0-9a-f]{64}$ ]]
          [[ "$CANVAS" =~ ^[0-9a-f]{64}$ ]]
          [[ "$PROOF_BUILD_KEY" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$PROOF_MANIFEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$PROOF_IDENTITY" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$TREE" =~ ^[0-9a-f]{64}$ ]]
          [[ "$GITHUB_REF" == refs/heads/main ]]
          [[ "$RUNNER_ENVIRONMENT" == github-hosted && "$ImageOS" == ubuntu24 && "$RUNNER_ARCH" == X64 ]]
          root="$RUNNER_TEMP/input"
          result="$root/result.json"
          test "$(jq -r .challenge "$result")" = "$INPUTS_CHALLENGE"
          test "$(jq -r .run_id "$result")" = "$INPUTS_RUN"
          test "$(jq -r .source_commit "$result")" = "$SOURCE_COMMIT"
          test "$(jq -r .source "$result")" = "$SOURCE"
          test "$(jq -r .archive_sha256 "$result")" = "$ARCHIVE_SHA256"
          test "$(jq -r .tree "$result")" = "$TREE"
          test "$(jq -r .app "$result")" = "$APP"
          test "$(jq -r .canvas "$result")" = "$CANVAS"
          test "$(jq -r .proof_build_key "$result")" = "$PROOF_BUILD_KEY"
          test "$(jq -r .proof_manifest "$result")" = "$PROOF_MANIFEST"
          test "$(jq -r .proof_identity "$result")" = "$PROOF_IDENTITY"
          test "$(jq -r .proof_config_sha256 "$result")" = "${PROOF_IDENTITY#sha256:}"
          archive="$root/source.tar"
          test "$(sha256sum "$archive" | cut -d' ' -f1)" = "$ARCHIVE_SHA256"
          find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          # Extraction stamps sources with the current time rather than the
          # commit time, so a restored bootstrap target never mistakes them for
          # older than a previous commit's build.
          tar -xmf "$archive" --strip-components=1 -C "$GITHUB_WORKSPACE"
          test "$(jq -r '.source.commit' dist/build.json)" = "$SOURCE_COMMIT"
          git init -q
          git config core.autocrlf false
          git config user.name spice-hosted
          git config user.email hosted@invalid
          git add -A -f -- .
          git commit -q -m "canonical source $SOURCE_COMMIT"
          test "$(git ls-tree -r -z --full-tree HEAD | sha256sum | cut -d' ' -f1)" = "$TREE"

      - name: Install exact Rust
        run: rustup toolchain install --no-self-update

      - name: Restore derivable bootstrap environment
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: |
            ${{ runner.temp }}/bootstrap-cargo
            ${{ runner.temp }}/bootstrap-target
          key: linux-bootstrap-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', '.cargo/config.toml') }}

      - name: Build repository-owned xtask
        env:
          CARGO_HOME: ${{ runner.temp }}/bootstrap-cargo
          CARGO_TARGET_DIR: ${{ runner.temp }}/bootstrap-target
        run: cargo build --locked --package xtask

      - name: Pull admitted layered proof image
        id: image
        env:
          GHCR_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          EXPECTED_PROOF_IDENTITY: ${{ inputs.proof_identity }}
        run: |
          set -euo pipefail
          xtask="$RUNNER_TEMP/bootstrap-target/debug/xtask"
          repository="ghcr.io/${GITHUB_REPOSITORY,,}/prepared"
          reference="$repository@${{ inputs.proof_manifest }}"
          printf '%s' "$GHCR_TOKEN" | oras login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          read -r label manifest config identity < <(
            "$xtask" prepared-artifact resolve-image \
              "$reference" "${{ inputs.proof_build_key }}"
          )
          test "$label" = resolved
          test "$manifest" = '${{ inputs.proof_manifest }}'
          test "$config" = "$EXPECTED_PROOF_IDENTITY"
          test "$identity" = "$EXPECTED_PROOF_IDENTITY"
          docker pull "$reference"
          vendor_set="$("$xtask" prepared-artifact vendor-set Cargo.lock | sed -n 's/^vendor set //p')"
          read -r observed architecture os observed_vendor observed_key < <(
            docker image inspect --format \
              '{{.Id}} {{.Architecture}} {{.Os}} {{index .Config.Labels "org.spice.vendor-set"}} {{index .Config.Labels "org.spice.build-key"}}' \
              "$reference"
          )
          test "$observed" = "$EXPECTED_PROOF_IDENTITY"
          test "$architecture $os" = "amd64 linux"
          test "$observed_vendor" = "$vendor_set"
          test "$observed_key" = '${{ inputs.proof_build_key }}'
          local_tag="spice-proof-image:${vendor_set#sha256:}"
          docker tag "$observed" "$local_tag"
          test "$(docker image inspect --format '{{.Id}}' "$local_tag")" = "$observed"
          echo "identity=$observed" >> "$GITHUB_OUTPUT"
          docker logout ghcr.io
          oras logout ghcr.io

      - name: Restore admitted Linux dependency layer
        env:
          GHCR_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          PROOF_IMAGE: ${{ steps.image.outputs.identity }}
        run: |
          set -euo pipefail
          xtask="$RUNNER_TEMP/bootstrap-target/debug/xtask"
          root="$RUNNER_TEMP/linux-dependencies"
          target="$RUNNER_TEMP/sealed-target"
          mkdir -p "$root"
          digest_text() {
            sha256sum | cut -d' ' -f1 | sed 's/^/sha256:/'
          }
          file_digest() {
            sha256sum "$1" | cut -d' ' -f1 | sed 's/^/sha256:/'
          }
          # The image's own Cargo resolves the third-party feature plan over
          # its vendored sources: the musl release graph and the host graph
          # its in-image xtask compiles under.
          resolved_plan() {
            docker run --rm --platform linux/amd64 --network=none --read-only \
              --cap-drop=ALL --security-opt=no-new-privileges \
              --mount "type=bind,source=$GITHUB_WORKSPACE,destination=/workspace,readonly" \
              --tmpfs /cargo-home:rw,noexec,mode=0700 --tmpfs /cargo-target:rw,mode=0700 \
              --workdir /workspace --env CARGO_HOME=/cargo-home \
              --env CARGO_TARGET_DIR=/cargo-target \
              "$PROOF_IMAGE" cargo metadata --locked --offline --format-version 1 "$@"
          }
          resolved=$( { resolved_plan --filter-platform x86_64-unknown-linux-musl \
              --features spice/canvas
            resolved_plan --filter-platform x86_64-unknown-linux-gnu; } \
            | jq -cs --sort-keys 'map(.workspace_members as $members
              | [.resolve.nodes[] | select(.id as $id | $members | index($id) | not)
              | {id, features}] | sort_by(.id))' \
            | digest_text)
          # Cargo.lock records no profiles: the root manifest owns them for
          # both the dev xtask build and the release candidate.
          profile=$(python3 -c 'import json, tomllib; print(json.dumps(tomllib.load(open("Cargo.toml", "rb")).get("profile", {}), sort_keys=True))' \
            | digest_text)
          # The prepared client interprets and admits the layer. Bind every
          # tracked implementation file by path, mode, and Git blob identity.
          contract_entries=$(git ls-files --stage -- prepared)
          test -n "$contract_entries"
          contract=$(printf '%s\n' "$contract_entries" | LC_ALL=C sort | digest_text)
          # The sealed image fixes these absolute paths for every dependency build.
          layout=$(printf '%s' 'workspace=/workspace;home=/cargo-home;target=/cargo-target' \
            | digest_text)
          # Bind the executable workflow contract by content, not the commit
          # which happened to dispatch it.
          workflow=$(file_digest .github/workflows/linux.yml)
          jq -n --sort-keys \
            --arg target "$(printf '%s' x86_64-unknown-linux-musl | digest_text)" \
            --arg image "$PROOF_IMAGE" --arg layout "$layout" \
            --arg lock "$(file_digest Cargo.lock)" \
            --arg cargo_config "$(file_digest .cargo/config.toml)" \
            --arg candidate "$(file_digest dist/release/candidate.toml)" \
            --arg resolved "$resolved" --arg profile "$profile" \
            --arg workflow "$workflow" --arg contract "$contract" \
            '{target:$target,image:$image,layout:$layout,lock:$lock,cargo_config:$cargo_config,candidate:$candidate,resolved:$resolved,profile:$profile,workflow:$workflow,contract:$contract}' \
            > "$root/build-key.json"
          key=$("$xtask" prepared-artifact build-key "$root/build-key.json" | sed -n 's/^build key //p')
          tag="${key#sha256:}"
          [[ "$tag" =~ ^[0-9a-f]{64}$ ]]
          repository="ghcr.io/${GITHUB_REPOSITORY,,}/prepared"
          # The credential lives only for this lookup; the sealed stage below
          # builds and runs third-party and repository code without it.
          printf '%s' "$GHCR_TOKEN" \
            | oras login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          trap 'oras logout ghcr.io' EXIT

          # A canonically absent layer builds cold. Resolver failures refuse;
          # a resolved layer that fails byte or record admission builds cold
          # without overwriting its occupied discovery tag.
          admit_restored() {
            local record="$root/restored/record.json"
            test "$(jq -r .schema "$record")" = 1 \
              && test "$(jq -r .build_key "$record")" = "$key" \
              && baseline=$(jq -r .cold_build_seconds "$record") \
              && [[ "$baseline" =~ ^[0-9]+$ ]] \
              && test -d "$root/restored/target/debug" \
              && test -d "$root/restored/target/release-appliance-build"
          }
          hit=0
          present=0
          manifest=-
          baseline=0
          if ! resolved_layer=$("$xtask" prepared-artifact resolve-if-present \
            "$repository:$tag" "$key"); then
            exit 1
          fi
          # Restore the target under host root, then hand only this admitted
          # bind source to the runner before sealed-target admission.
          sudo install -d -o 0 -g 0 -m 0755 "$target"
          case "$resolved_layer" in
            absent)
              ;;
            resolved\ *)
              present=1
              read -r label manifest _ <<< "$resolved_layer"
              test "$label" = resolved
              if "$xtask" prepared-artifact fetch-extract "$repository@$manifest" "$key" \
                "$root/restored" && admit_restored; then
                # Cargo freshness is an ordering relation between dependency
                # outputs, dependent outputs, and fingerprint markers. The
                # archive preserves those mtimes; copy them intact.
                sudo cp -pR "$root/restored/target/." "$target/"
                sudo chown -R 0:0 "$target"
                hit=1
              else
                echo "prepared layer $manifest refused; building cold" >&2
                baseline=0
              fi
              rm -rf "$root/restored"
              ;;
            *)
              echo "prepared resolver returned malformed output: $resolved_layer" >&2
              exit 65
              ;;
          esac
          sudo chown -R "$(id -u):$(id -g)" "$target"
          {
            printf 'DEPENDENCY_BUILD_KEY=%s\n' "$key"
            printf 'DEPENDENCY_REPOSITORY=%s\n' "$repository"
            printf 'DEPENDENCY_TAG=%s\n' "$tag"
            printf 'DEPENDENCY_MANIFEST=%s\n' "$manifest"
            printf 'DEPENDENCY_HIT=%s\n' "$hit"
            printf 'DEPENDENCY_PRESENT=%s\n' "$present"
            printf 'DEPENDENCY_BASELINE_SECONDS=%s\n' "$baseline"
          } >> "$GITHUB_ENV"

      - name: Stage and prove in the sealed image
        env:
          SPICE_SOURCE_ARCHIVE: ${{ inputs.source }}
          SPICE_RELEASE_CANVAS: ${{ runner.temp }}/input/canvas.zip
          SPICE_RELEASE_APP: ${{ inputs.app }}
          SPICE_SEALED_TARGET: ${{ runner.temp }}/sealed-target
        run: |
          set -uo pipefail
          started=$(date +%s)
          sudo install -d -o 0 -g 0 -m 0755 dist/stage
          common="$(git rev-parse --git-common-dir)"
          mkdir -p "$common/.spice"
          printf '[proof]\ncontainer = "%s"\n' "$(command -v docker)" > "$common/.spice/config.toml"
          xtask="$RUNNER_TEMP/bootstrap-target/debug/xtask"
          "$xtask" stage-target x86_64-unknown-linux-musl --unsigned --sealed \
            2>&1 | tee "$RUNNER_TEMP/stage.log"
          status="${PIPESTATUS[0]}"
          if [[ "$status" == 0 ]]; then
            # The sealed container writes the payload into the root-owned stage;
            # the runner-user proof publishes its detached receipt beside it.
            sudo install -d -o "$(id -u)" -g "$(id -g)" -m 0755 dist/stage/proofs
            "$xtask" prove-staged-target x86_64-unknown-linux-musl \
              2>&1 | tee -a "$RUNNER_TEMP/stage.log"
            status="${PIPESTATUS[0]}"
          fi
          echo "$status" > "$RUNNER_TEMP/stage.exit"
          printf 'STAGE_SECONDS=%s\n' "$(($(date +%s) - started))" >> "$GITHUB_ENV"

      # Publication is an optimization: any failure here records the layer
      # unpublished and never fails the stage.
      - name: Publish Linux dependency layer
        id: dependency_publish
        if: env.DEPENDENCY_HIT == '0' && env.DEPENDENCY_PRESENT == '0'
        continue-on-error: true
        env:
          GHCR_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          PROOF_IMAGE: ${{ steps.image.outputs.identity }}
        run: |
          set -euo pipefail
          if [[ "$(cat "$RUNNER_TEMP/stage.exit")" != 0 ]]; then
            echo 'the stage failed; the layer stays unpublished' >&2
            exit 1
          fi
          xtask="$RUNNER_TEMP/bootstrap-target/debug/xtask"
          root="$RUNNER_TEMP/linux-dependencies"
          target="$RUNNER_TEMP/sealed-target"
          packages=()
          while IFS= read -r package; do
            packages+=(--package "$package")
          done < <(cargo metadata --locked --offline --no-deps --format-version 1 \
            | jq -r '.workspace_members[] as $id | .packages[] | select(.id == $id) | .name')
          # Prune repository packages with the image's own Cargo. Cargo refuses
          # to clean a directory without its cache tag, and neither target root
          # was created by Cargo: this job made the mounted root, and the
          # release target's canvas object lands before Cargo first writes it.
          docker run --rm --platform linux/amd64 --network=none --read-only \
            --cap-drop=ALL --security-opt=no-new-privileges \
            --mount "type=bind,source=$GITHUB_WORKSPACE,destination=/workspace,readonly" \
            --mount "type=bind,source=$target,destination=/cargo-target" \
            --tmpfs /cargo-home:rw,noexec,mode=0700 \
            --workdir /workspace --env CARGO_HOME=/cargo-home \
            --env CARGO_TARGET_DIR=/cargo-target \
            --env CARGO_INCREMENTAL=0 --env RUSTC_WRAPPER= --env RUSTC_WORKSPACE_WRAPPER= \
            "$PROOF_IMAGE" sh -euc '
              release=/cargo-target/release-appliance
              for directory in /cargo-target "$release"; do
                test -f "$directory/CACHEDIR.TAG" \
                  || printf "Signature: 8a477f597d28d172789f06886806bc55\n" \
                    > "$directory/CACHEDIR.TAG"
              done
              cargo clean "$@"
              CARGO_BUILD_BUILD_DIR=/cargo-target/release-appliance-build \
                cargo clean --release --target x86_64-unknown-linux-musl \
                --target-dir "$release" "$@"
            ' sh "${packages[@]}"
          sudo chown -R "$(id -u):$(id -g)" "$target"
          publish="$root/publish"
          mkdir -p "$publish/target"
          # Only Cargo's own outputs travel: the canvas object and the
          # temporary directory belong to this run.
          for entry in CACHEDIR.TAG debug release-appliance release-appliance-build; do
            mv "$target/$entry" "$publish/target/"
          done
          rm -rf "$publish/target/release-appliance/canvas"
          # Cold hosted run 45949529571 spent 740s staging. Keep the reference
          # fixed so the prepared payload is idempotent.
          jq -n --sort-keys --arg build_key "$DEPENDENCY_BUILD_KEY" \
            --argjson seconds 740 --argjson run 45949529571 \
            '{schema:1,build_key:$build_key,cold_build_seconds:$seconds,cold_build_run:$run}' \
            > "$publish/record.json"
          archive="$root/linux-dependencies.tar.gz"
          config="$root/prepared.json"
          "$xtask" prepared-artifact pack-preserve-times "$publish" "$archive"
          "$xtask" prepared-artifact manifest \
            bundle linux-amd64 "$root/build-key.json" application/gzip \
            "$archive" "$publish" - "$config"
          printf '%s' "$GHCR_TOKEN" \
            | oras login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          trap 'oras logout ghcr.io' EXIT
          output=$("$xtask" prepared-artifact publish \
            "$DEPENDENCY_REPOSITORY" "$DEPENDENCY_TAG" "$config" "$archive")
          read -r label published <<< "$output"
          test "$label" = published
          printf '%s\n' "$published" > "$root/published"

      - name: Record Linux dependency layer
        if: always()
        env:
          PUBLISH_OUTCOME: ${{ steps.dependency_publish.outcome }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/linux-dependencies"
          manifest="${DEPENDENCY_MANIFEST:--}"
          case "${DEPENDENCY_HIT:-0}:${DEPENDENCY_PRESENT:-0}:$PUBLISH_OUTCOME" in
            1:*) publication=reused ;;
            0:1:*) publication='unpublished: the tag names a refused layer' ;;
            0:0:success)
              publication=published
              manifest=$(cat "$root/published")
              ;;
            *) publication="unpublished: publication $PUBLISH_OUTCOME" ;;
          esac
          {
            printf '### Linux dependency layer\n\n'
            printf -- '- build key: `%s`\n' "${DEPENDENCY_BUILD_KEY:-unknown}"
            printf -- '- cache hit: `%s`\n' "${DEPENDENCY_HIT:-0}"
            printf -- '- sealed stage: `%ss`\n' "${STAGE_SECONDS:-unknown}"
            printf -- '- cold reference: `%ss`\n' "${DEPENDENCY_BASELINE_SECONDS:-0}"
            printf -- '- layer: `%s` (%s)\n' "$manifest" "$publication"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke staged Linux payload version
        run: |
          set -uo pipefail
          : > "$RUNNER_TEMP/smoke.log"
          if [[ "$(cat "$RUNNER_TEMP/stage.exit")" != 0 ]]; then
            echo 125 > "$RUNNER_TEMP/smoke.exit"
            exit 0
          fi
          target=x86_64-unknown-linux-musl
          payload="dist/stage/targets/$target/payload.json"
          read -r digest mode < <(jq -r --arg path bin/spice \
            '.inventory[] | select(.path == $path) | "\(.digest) \(.mode)"' "$payload")
          [[ -n "$digest" && -n "$mode" ]] \
            || { echo "staged Linux payload names no executable" >&2; exit 1; }
          object="$(printf '%s-%04o' "$digest" "$mode")"
          executable="dist/stage/objects/$object"
          "$executable" --version 2>&1 | tee "$RUNNER_TEMP/smoke.log"
          echo "${PIPESTATUS[0]}" > "$RUNNER_TEMP/smoke.exit"

      - name: Record signed result
        env:
          CHALLENGE: ${{ inputs.challenge }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          SOURCE: ${{ inputs.source }}
          ARCHIVE_SHA256: ${{ inputs.archive_sha256 }}
          RELEASE_INPUTS_RUN: ${{ inputs.release_inputs_run }}
          RELEASE_INPUTS_CHALLENGE: ${{ inputs.release_inputs_challenge }}
          APP: ${{ inputs.app }}
          CANVAS: ${{ inputs.canvas }}
          TREE: ${{ inputs.tree }}
          PROOF_BUILD_KEY: ${{ inputs.proof_build_key }}
          PROOF_MANIFEST: ${{ inputs.proof_manifest }}
          PROOF_IMAGE: ${{ inputs.proof_identity }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/linux-$CHALLENGE"
          mkdir -p "$out/stage" "$out/smoke"
          cp "$RUNNER_TEMP/stage.log" "$out/stage.log"
          cp "$RUNNER_TEMP/smoke.log" "$out/smoke.log"
          if [[ -d dist/stage ]]; then
            cp -R dist/stage/. "$out/stage/"
            rm -f "$out/stage/source.tar"
          fi
          if [[ -d "$RUNNER_TEMP/smoke" ]]; then
            cp -R "$RUNNER_TEMP/smoke/." "$out/smoke/"
          fi
          inventory() {
            local directory="$1"
            (cd "$directory" && find . -type f -printf '%P\t%s\n' | sort) \
              | while IFS=$'\t' read -r path bytes; do
                  sha="$(sha256sum "$directory/$path" | cut -d' ' -f1)"
                  jq -n --arg path "$path" --argjson bytes "$bytes" --arg sha256 "$sha" \
                    '{path: $path, bytes: $bytes, sha256: $sha256}'
                done | jq -s .
          }
          inventory "$out/stage" > "$RUNNER_TEMP/artifacts.json"
          inventory "$out/smoke" > "$RUNNER_TEMP/smoke-artifacts.json"
          jq -n \
            --arg challenge "$CHALLENGE" \
            --arg source_commit "$SOURCE_COMMIT" \
            --arg source "$SOURCE" \
            --arg archive_sha256 "$ARCHIVE_SHA256" \
            --argjson release_inputs_run "$RELEASE_INPUTS_RUN" \
            --arg release_inputs_challenge "$RELEASE_INPUTS_CHALLENGE" \
            --arg app "$APP" \
            --arg canvas "$CANVAS" \
            --arg tree "$TREE" \
            --argjson run_id "$GITHUB_RUN_ID" \
            --arg image_os "$ImageOS" \
            --arg image_version "$ImageVersion" \
            --arg architecture "$RUNNER_ARCH" \
            --arg proof_build_key "$PROOF_BUILD_KEY" \
            --arg proof_manifest "$PROOF_MANIFEST" \
            --arg proof_image "$PROOF_IMAGE" \
            --argjson exit_code "$(cat "$RUNNER_TEMP/stage.exit")" \
            --arg log_sha256 "$(sha256sum "$out/stage.log" | cut -d' ' -f1)" \
            --argjson smoke_exit_code "$(cat "$RUNNER_TEMP/smoke.exit")" \
            --arg smoke_log_sha256 "$(sha256sum "$out/smoke.log" | cut -d' ' -f1)" \
            --slurpfile artifacts "$RUNNER_TEMP/artifacts.json" \
            --slurpfile smoke_artifacts "$RUNNER_TEMP/smoke-artifacts.json" \
            '{challenge: $challenge, source_commit: $source_commit, source: $source,
              archive_sha256: $archive_sha256, release_inputs_run: $release_inputs_run,
              release_inputs_challenge: $release_inputs_challenge, tree: $tree,
              app: $app, canvas: $canvas, run_id: $run_id, image_os: $image_os,
              image_version: $image_version, architecture: $architecture,
              proof_build_key: $proof_build_key, proof_manifest: $proof_manifest,
              proof_image: $proof_image, exit_code: $exit_code, log_sha256: $log_sha256,
              smoke_exit_code: $smoke_exit_code, smoke_log_sha256: $smoke_log_sha256,
              artifacts: $artifacts[0], smoke_artifacts: $smoke_artifacts[0]}' > "$out/result.json"
          "$RUNNER_TEMP/bootstrap-target/debug/xtask" declare-native-stage \
            x86_64-unknown-linux-musl "$out"

      - name: Publish result, log, and staged output
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: linux-${{ inputs.challenge }}
          path: ${{ runner.temp }}/linux-${{ inputs.challenge }}
          if-no-files-found: error
          retention-days: 1


  attest:
    name: Attest Linux
    needs: stage
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      attestations: write
      id-token: write
    steps:
      - name: Download result
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: linux-${{ inputs.challenge }}
          path: ${{ runner.temp }}/result

      - name: Require the declared attestation subjects
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/result"
          # Both sides sort under jq's one collation: subjects.json keeps the
          # Rust path order, which places stage/ before stage.log.
          test "$(cd "$root" && find . -type f ! -path ./subjects.json | sed 's|^\./||' \
            | jq -R . | jq -cs sort)" = "$(jq -c sort "$root/subjects.json")"

      - name: Attest complete hosted artifact
        uses: actions/attest-build-provenance@62fc1d596301d0ab9914e1fec14dc5c8d93f65cd
        with:
          subject-path: ${{ runner.temp }}/result/**
