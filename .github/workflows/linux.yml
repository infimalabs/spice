name: Linux staging
run-name: Hosted archive ${{ inputs.challenge }}

on:
  workflow_dispatch:
    inputs:
      challenge:
        description: Unique lowercase 64-hex execution challenge
        required: true
        type: string
      source_commit:
        description: Canonical source commit recorded by source.tar
        required: true
        type: string
      source:
        description: Canonical source-archive identity
        required: true
        type: string
      archive_sha256:
        description: Raw SHA-256 of source.tar
        required: true
        type: string
      transport_asset:
        description: Immutable source.tar release-asset ID
        required: true
        type: string
      tree:
        description: Exact canonical source tree digest
        required: true
        type: string

permissions: {}

jobs:
  stage:
    name: Sealed x86_64-unknown-linux-musl stage
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      contents: read
    steps:
      - name: Admit runner and direct source transport
        env:
          GH_TOKEN: ${{ github.token }}
          CHALLENGE: ${{ inputs.challenge }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          ARCHIVE_SHA256: ${{ inputs.archive_sha256 }}
          TRANSPORT_ASSET: ${{ inputs.transport_asset }}
          TREE: ${{ inputs.tree }}
        run: |
          set -euo pipefail
          [[ "$CHALLENGE" =~ ^[0-9a-f]{64}$ ]]
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$ARCHIVE_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$TRANSPORT_ASSET" =~ ^[1-9][0-9]*$ ]]
          [[ "$TREE" =~ ^[0-9a-f]{64}$ ]]
          [[ "$GITHUB_REF" == refs/heads/main ]]
          [[ "$RUNNER_ENVIRONMENT" == github-hosted && "$ImageOS" == ubuntu24 && "$RUNNER_ARCH" == X64 ]]
          archive="$RUNNER_TEMP/source.tar"
          gh api -H "Accept: application/octet-stream" \
            "repos/$GITHUB_REPOSITORY/releases/assets/$TRANSPORT_ASSET" > "$archive"
          test "$(sha256sum "$archive" | cut -d' ' -f1)" = "$ARCHIVE_SHA256"
          find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          tar -xf "$archive" --strip-components=1 -C "$GITHUB_WORKSPACE"
          test "$(jq -r '.source.commit' dist/build.json)" = "$SOURCE_COMMIT"
          git init -q
          git config core.autocrlf false
          git config user.name spice-hosted
          git config user.email hosted@invalid
          git add -A -f -- .
          git commit -q -m "canonical source $SOURCE_COMMIT"
          test "$(git ls-tree -r -z --full-tree HEAD | sha256sum | cut -d' ' -f1)" = "$TREE"

      - name: Install exact Rust
        run: rustup toolchain install --no-self-update

      - name: Build repository-owned xtask
        env:
          CARGO_HOME: ${{ runner.temp }}/bootstrap-cargo
          CARGO_TARGET_DIR: ${{ runner.temp }}/bootstrap-target
        run: cargo build --locked --package xtask

      - name: Build vendor-set proof image
        id: image
        env:
          CARGO_HOME: ${{ runner.temp }}/bootstrap-cargo
        run: |
          set -euo pipefail
          xtask="$RUNNER_TEMP/bootstrap-target/debug/xtask"
          "$xtask" proof-image build "$RUNNER_TEMP/proof-image.tar" | tee "$RUNNER_TEMP/proof-image.out"
          identity="$(sed -n 's/^proof image //p' "$RUNNER_TEMP/proof-image.out")"
          [[ -n "$identity" ]]
          echo "identity=$identity" >> "$GITHUB_OUTPUT"
          rm -f "$RUNNER_TEMP/proof-image.tar"

      - name: Stage in the sealed image
        env:
          SPICE_SOURCE_ARCHIVE: ${{ inputs.source }}
        run: |
          set -uo pipefail
          sudo install -d -o 0 -g 0 -m 0755 dist/stage
          common="$(git rev-parse --git-common-dir)"
          mkdir -p "$common/.spice"
          printf '[proof]\ncontainer = "%s"\n' "$(command -v docker)" > "$common/.spice/config.toml"
          "$RUNNER_TEMP/bootstrap-target/debug/xtask" stage-target x86_64-unknown-linux-musl --unsigned --sealed \
            2>&1 | tee "$RUNNER_TEMP/stage.log"
          echo "${PIPESTATUS[0]}" > "$RUNNER_TEMP/stage.exit"

      - name: Record signed result
        env:
          CHALLENGE: ${{ inputs.challenge }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          SOURCE: ${{ inputs.source }}
          ARCHIVE_SHA256: ${{ inputs.archive_sha256 }}
          TRANSPORT_ASSET: ${{ inputs.transport_asset }}
          TREE: ${{ inputs.tree }}
          PROOF_IMAGE: ${{ steps.image.outputs.identity }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/linux-$CHALLENGE"
          mkdir -p "$out/stage"
          cp "$RUNNER_TEMP/stage.log" "$out/stage.log"
          if [[ -d dist/stage ]]; then
            cp -R dist/stage/. "$out/stage/"
            rm -f "$out/stage/source.tar"
          fi
          (cd "$out/stage" && find . -type f -printf '%P\t%s\n' | sort) \
            | while IFS=$'\t' read -r path bytes; do
                sha="$(sha256sum "$out/stage/$path" | cut -d' ' -f1)"
                jq -n --arg path "$path" --argjson bytes "$bytes" --arg sha256 "$sha" \
                  '{path: $path, bytes: $bytes, sha256: $sha256}'
              done | jq -s . > "$RUNNER_TEMP/artifacts.json"
          jq -n \
            --arg challenge "$CHALLENGE" \
            --arg source_commit "$SOURCE_COMMIT" \
            --arg source "$SOURCE" \
            --arg archive_sha256 "$ARCHIVE_SHA256" \
            --argjson transport_asset "$TRANSPORT_ASSET" \
            --arg tree "$TREE" \
            --argjson run_id "$GITHUB_RUN_ID" \
            --arg image_os "$ImageOS" \
            --arg image_version "$ImageVersion" \
            --arg architecture "$RUNNER_ARCH" \
            --arg proof_image "$PROOF_IMAGE" \
            --argjson exit_code "$(cat "$RUNNER_TEMP/stage.exit")" \
            --arg log_sha256 "$(sha256sum "$out/stage.log" | cut -d' ' -f1)" \
            --slurpfile artifacts "$RUNNER_TEMP/artifacts.json" \
            '{challenge: $challenge, source_commit: $source_commit, source: $source,
              archive_sha256: $archive_sha256, transport_asset: $transport_asset, tree: $tree,
              run_id: $run_id, image_os: $image_os, image_version: $image_version,
              architecture: $architecture, proof_image: $proof_image, exit_code: $exit_code,
              log_sha256: $log_sha256, artifacts: $artifacts[0]}' > "$out/result.json"

      - name: Publish result, log, and staged output
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: linux-${{ inputs.challenge }}
          path: ${{ runner.temp }}/linux-${{ inputs.challenge }}
          if-no-files-found: error
          retention-days: 1

  attest:
    name: Sign result with GitHub OIDC identity
    needs: stage
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      attestations: write
      id-token: write
    steps:
      - name: Download result
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: linux-${{ inputs.challenge }}
          path: ${{ runner.temp }}/result

      - name: Sign result and staged files
        uses: actions/attest-build-provenance@62fc1d596301d0ab9914e1fec14dc5c8d93f65cd
        with:
          subject-path: |
            ${{ runner.temp }}/result/result.json
            ${{ runner.temp }}/result/stage/**
