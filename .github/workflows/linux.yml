name: Linux staging

on:
  workflow_dispatch:
    inputs:
      challenge:
        description: Client challenge naming this run's one-use source ref and artifact
        required: true
        type: string
      source:
        description: Identity of the canonical source archive whose tree the ref is
        required: true
        type: string

permissions: {}

jobs:
  stage:
    name: Sealed x86_64-unknown-linux-musl stage
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      contents: read
    steps:
      - name: Admit runner and request
        env:
          CHALLENGE: ${{ inputs.challenge }}
          SOURCE: ${{ inputs.source }}
        run: |
          set -euo pipefail
          [[ "$CHALLENGE" =~ ^[0-9a-f]{64}$ ]] || { echo "challenge is not 32 hex bytes" >&2; exit 1; }
          [[ "$SOURCE" =~ ^[0-9A-Za-z:._-]+$ ]] || { echo "source identity is malformed" >&2; exit 1; }
          [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" == "hosted-${CHALLENGE:0:24}" ]] \
            || { echo "refusing source ref $GITHUB_REF for this challenge" >&2; exit 1; }
          [[ "$RUNNER_ENVIRONMENT" == github-hosted && "$ImageOS" == ubuntu24 && "$RUNNER_ARCH" == X64 ]] \
            || { echo "runner is not a GitHub-hosted ubuntu24 X64 machine" >&2; exit 1; }

      - name: Check out exact source ref
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Install exact Rust
        run: rustup toolchain install --no-self-update

      - name: Build repository-owned xtask
        env:
          CARGO_HOME: ${{ runner.temp }}/bootstrap-cargo
          CARGO_TARGET_DIR: ${{ runner.temp }}/bootstrap-target
        run: cargo build --locked --package xtask

      - name: Build vendor-set proof image
        id: image
        env:
          CARGO_HOME: ${{ runner.temp }}/bootstrap-cargo
        run: |
          set -euo pipefail
          xtask="$RUNNER_TEMP/bootstrap-target/debug/xtask"
          "$xtask" proof-image build "$RUNNER_TEMP/proof-image.tar" | tee "$RUNNER_TEMP/proof-image.out"
          identity="$(sed -n 's/^proof image //p' "$RUNNER_TEMP/proof-image.out")"
          [[ -n "$identity" ]] || { echo "proof image build named no identity" >&2; exit 1; }
          echo "identity=$identity" >> "$GITHUB_OUTPUT"
          rm -f "$RUNNER_TEMP/proof-image.tar"

      - name: Stage in the sealed image
        env:
          SPICE_SOURCE_ARCHIVE: ${{ inputs.source }}
        run: |
          set -uo pipefail
          # The proof image runs as UID 0 with every capability dropped. Give
          # that exact principal the sole writable workspace mount without
          # making the checkout or Git common directory writable.
          sudo install -d -o 0 -g 0 -m 0755 dist/stage
          common="$(git rev-parse --git-common-dir)"
          mkdir -p "$common/.spice"
          printf '[proof]\ncontainer = "%s"\n' "$(command -v docker)" > "$common/.spice/config.toml"
          "$RUNNER_TEMP/bootstrap-target/debug/xtask" stage-target x86_64-unknown-linux-musl --unsigned --sealed \
            2>&1 | tee "$RUNNER_TEMP/stage.log"
          echo "${PIPESTATUS[0]}" > "$RUNNER_TEMP/stage.exit"

      - name: Record signed result
        env:
          CHALLENGE: ${{ inputs.challenge }}
          SOURCE: ${{ inputs.source }}
          PROOF_IMAGE: ${{ steps.image.outputs.identity }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/linux-$CHALLENGE"
          mkdir -p "$out/stage"
          cp "$RUNNER_TEMP/stage.log" "$out/stage.log"
          if [[ -d dist/stage ]]; then
            cp -R dist/stage/. "$out/stage/"
            rm -f "$out/stage/source.tar"
          fi
          (cd "$out/stage" && find . -type f -printf '%P\t%s\n' | sort) \
            | while IFS=$'\t' read -r path bytes; do
                sha="$(sha256sum "$out/stage/$path" | cut -d' ' -f1)"
                jq -n --arg path "$path" --argjson bytes "$bytes" --arg sha256 "$sha" \
                  '{path: $path, bytes: $bytes, sha256: $sha256}'
              done | jq -s . > "$RUNNER_TEMP/artifacts.json"
          jq -n \
            --arg challenge "$CHALLENGE" \
            --arg source "$SOURCE" \
            --argjson run_id "$GITHUB_RUN_ID" \
            --arg image_os "$ImageOS" \
            --arg image_version "$ImageVersion" \
            --arg architecture "$RUNNER_ARCH" \
            --arg proof_image "$PROOF_IMAGE" \
            --argjson exit_code "$(cat "$RUNNER_TEMP/stage.exit")" \
            --arg log_sha256 "$(sha256sum "$out/stage.log" | cut -d' ' -f1)" \
            --slurpfile artifacts "$RUNNER_TEMP/artifacts.json" \
            '{challenge: $challenge, source: $source, run_id: $run_id, image_os: $image_os,
              image_version: $image_version, architecture: $architecture,
              proof_image: $proof_image, exit_code: $exit_code, log_sha256: $log_sha256,
              artifacts: $artifacts[0]}' > "$out/result.json"

      - name: Publish result, log, and staged output
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: linux-${{ inputs.challenge }}
          path: ${{ runner.temp }}/linux-${{ inputs.challenge }}
          if-no-files-found: error
          retention-days: 1

      # The release's Darwin and Windows stages link this run's canvas instead
      # of compiling their own app. Like every run artifact, the digest-named
      # canvas persists until its retention expires it.
      - name: Collect staged canvas
        id: canvas
        run: |
          set -euo pipefail
          [[ "$(cat "$RUNNER_TEMP/stage.exit")" == 0 ]] || exit 0
          payload=dist/stage/targets/x86_64-unknown-linux-musl/payload.json
          canvas="$RUNNER_TEMP/canvas"
          mkdir -p "$canvas/targets/x86_64-unknown-linux-musl" "$canvas/objects"
          cp "$payload" "$canvas/targets/x86_64-unknown-linux-musl/payload.json"
          jq -r '.inventory[] | "\(.digest) \(.mode)"' "$payload" \
            | while read -r digest mode; do
                object="$(printf '%s-%04o' "$digest" "$mode")"
                cp "dist/stage/objects/$object" "$canvas/objects/$object"
              done
          echo "name=canvas-$(jq -r .canvas "$payload")" >> "$GITHUB_OUTPUT"

      - name: Publish staged canvas
        if: steps.canvas.outputs.name != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.canvas.outputs.name }}
          path: ${{ runner.temp }}/canvas
          if-no-files-found: error
          retention-days: 7

  attest:
    name: Sign result with GitHub OIDC identity
    needs: stage
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      attestations: write
      id-token: write
    steps:
      - name: Download result
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: linux-${{ inputs.challenge }}
          path: ${{ runner.temp }}/result

      - name: Sign result and staged files
        uses: actions/attest-build-provenance@62fc1d596301d0ab9914e1fec14dc5c8d93f65cd
        with:
          subject-path: |
            ${{ runner.temp }}/result/result.json
            ${{ runner.temp }}/result/stage/**

  retire:
    name: Retire one-use source ref
    needs: [stage, attest]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Delete source tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" == hosted-* ]] \
            || { echo "refusing to retire non-hosted source ref $GITHUB_REF" >&2; exit 1; }
          if ! gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$GITHUB_REF_NAME" >/dev/null; then
            if gh api "repos/$GITHUB_REPOSITORY/git/refs/tags/$GITHUB_REF_NAME" >/dev/null 2>&1; then
              echo "source ref $GITHUB_REF_NAME survived deletion" >&2
              exit 1
            fi
          fi
