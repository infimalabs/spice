name: Linux staging
run-name: Hosted archive ${{ inputs.challenge }}

on:
  workflow_dispatch:
    inputs:
      challenge:
        description: Unique lowercase 64-hex execution challenge
        required: true
        type: string
      source_commit:
        description: Canonical source commit recorded by source.tar
        required: true
        type: string
      source:
        description: Canonical source-archive identity
        required: true
        type: string
      archive_sha256:
        description: Raw SHA-256 of source.tar
        required: true
        type: string
      transport_asset:
        description: Immutable source.tar release-asset ID
        required: true
        type: string
      tree:
        description: Exact canonical source tree digest
        required: true
        type: string

permissions: {}

jobs:
  stage:
    name: Sealed x86_64-unknown-linux-musl stage
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      contents: write
    steps:
      - name: Admit runner and direct source transport
        env:
          GH_TOKEN: ${{ github.token }}
          CHALLENGE: ${{ inputs.challenge }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          ARCHIVE_SHA256: ${{ inputs.archive_sha256 }}
          TRANSPORT_ASSET: ${{ inputs.transport_asset }}
          TREE: ${{ inputs.tree }}
        run: |
          set -euo pipefail
          [[ "$CHALLENGE" =~ ^[0-9a-f]{64}$ ]]
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$ARCHIVE_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$TRANSPORT_ASSET" =~ ^[1-9][0-9]*$ ]]
          [[ "$TREE" =~ ^[0-9a-f]{64}$ ]]
          [[ "$GITHUB_REF" == refs/heads/main ]]
          [[ "$RUNNER_ENVIRONMENT" == github-hosted && "$ImageOS" == ubuntu24 && "$RUNNER_ARCH" == X64 ]]
          archive="$RUNNER_TEMP/source.tar"
          gh api -H "Accept: application/octet-stream" \
            "repos/$GITHUB_REPOSITORY/releases/assets/$TRANSPORT_ASSET" > "$archive"
          test "$(sha256sum "$archive" | cut -d' ' -f1)" = "$ARCHIVE_SHA256"
          find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          tar -xf "$archive" --strip-components=1 -C "$GITHUB_WORKSPACE"
          test "$(jq -r '.source.commit' dist/build.json)" = "$SOURCE_COMMIT"
          git init -q
          git config core.autocrlf false
          git config user.name spice-hosted
          git config user.email hosted@invalid
          git add -A -f -- .
          git commit -q -m "canonical source $SOURCE_COMMIT"
          test "$(git ls-tree -r -z --full-tree HEAD | sha256sum | cut -d' ' -f1)" = "$TREE"

      - name: Install exact Rust
        run: rustup toolchain install --no-self-update

      - name: Build repository-owned xtask
        env:
          CARGO_HOME: ${{ runner.temp }}/bootstrap-cargo
          CARGO_TARGET_DIR: ${{ runner.temp }}/bootstrap-target
        run: cargo build --locked --package xtask

      - name: Build vendor-set proof image
        id: image
        env:
          CARGO_HOME: ${{ runner.temp }}/bootstrap-cargo
        run: |
          set -euo pipefail
          xtask="$RUNNER_TEMP/bootstrap-target/debug/xtask"
          "$xtask" proof-image build "$RUNNER_TEMP/proof-image.tar" | tee "$RUNNER_TEMP/proof-image.out"
          identity="$(sed -n 's/^proof image //p' "$RUNNER_TEMP/proof-image.out")"
          [[ -n "$identity" ]]
          echo "identity=$identity" >> "$GITHUB_OUTPUT"
          rm -f "$RUNNER_TEMP/proof-image.tar"

      - name: Stage in the sealed image
        env:
          SPICE_SOURCE_ARCHIVE: ${{ inputs.source }}
        run: |
          set -uo pipefail
          sudo install -d -o 0 -g 0 -m 0755 dist/stage
          common="$(git rev-parse --git-common-dir)"
          mkdir -p "$common/.spice"
          printf '[proof]\ncontainer = "%s"\n' "$(command -v docker)" > "$common/.spice/config.toml"
          "$RUNNER_TEMP/bootstrap-target/debug/xtask" stage-target x86_64-unknown-linux-musl --unsigned --sealed \
            2>&1 | tee "$RUNNER_TEMP/stage.log"
          echo "${PIPESTATUS[0]}" > "$RUNNER_TEMP/stage.exit"

      - name: Prove staged Linux payload in its exact image
        env:
          SOURCE: ${{ inputs.source }}
        run: |
          set -uo pipefail
          : > "$RUNNER_TEMP/proof.log"
          if [[ "$(cat "$RUNNER_TEMP/stage.exit")" != 0 ]]; then
            echo 125 > "$RUNNER_TEMP/proof.exit"
            exit 0
          fi
          target=x86_64-unknown-linux-musl
          payload="dist/stage/targets/$target/payload.json"
          read -r digest mode < <(jq -r --arg path spice \
            '.inventory[] | select(.path == $path) | "\(.digest) \(.mode)"' "$payload")
          [[ -n "$digest" && -n "$mode" ]] \
            || { echo "staged Linux payload names no executable" >&2; exit 1; }
          object="$(printf '%s-%04o' "$digest" "$mode")"
          executable="dist/stage/objects/$object"
          "$executable" proof --target "$target" 2>&1 | tee "$RUNNER_TEMP/proof.log"
          code="${PIPESTATUS[0]}"
          echo "$code" > "$RUNNER_TEMP/proof.exit"
          if [[ "$code" == 0 ]]; then
            common="$(git rev-parse --git-common-dir)"
            receipt="$common/.spice/cache/proof/$SOURCE/$target/receipt.json"
            [[ -f "$receipt" ]] || { echo "successful proof published no receipt" >&2; exit 1; }
            mkdir -p "$RUNNER_TEMP/proof"
            cp "$receipt" "$RUNNER_TEMP/proof/receipt.json"
          fi

      - name: Record signed result
        env:
          CHALLENGE: ${{ inputs.challenge }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          SOURCE: ${{ inputs.source }}
          ARCHIVE_SHA256: ${{ inputs.archive_sha256 }}
          TRANSPORT_ASSET: ${{ inputs.transport_asset }}
          TREE: ${{ inputs.tree }}
          PROOF_IMAGE: ${{ steps.image.outputs.identity }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/linux-$CHALLENGE"
          mkdir -p "$out/stage" "$out/proof"
          cp "$RUNNER_TEMP/stage.log" "$out/stage.log"
          cp "$RUNNER_TEMP/proof.log" "$out/proof.log"
          if [[ -d dist/stage ]]; then
            cp -R dist/stage/. "$out/stage/"
            rm -f "$out/stage/source.tar"
          fi
          if [[ -d "$RUNNER_TEMP/proof" ]]; then
            cp -R "$RUNNER_TEMP/proof/." "$out/proof/"
          fi
          inventory() {
            local directory="$1"
            (cd "$directory" && find . -type f -printf '%P\t%s\n' | sort) \
              | while IFS=$'\t' read -r path bytes; do
                  sha="$(sha256sum "$directory/$path" | cut -d' ' -f1)"
                  jq -n --arg path "$path" --argjson bytes "$bytes" --arg sha256 "$sha" \
                    '{path: $path, bytes: $bytes, sha256: $sha256}'
                done | jq -s .
          }
          inventory "$out/stage" > "$RUNNER_TEMP/artifacts.json"
          inventory "$out/proof" > "$RUNNER_TEMP/proof-artifacts.json"
          jq -n \
            --arg challenge "$CHALLENGE" \
            --arg source_commit "$SOURCE_COMMIT" \
            --arg source "$SOURCE" \
            --arg archive_sha256 "$ARCHIVE_SHA256" \
            --argjson transport_asset "$TRANSPORT_ASSET" \
            --arg tree "$TREE" \
            --argjson run_id "$GITHUB_RUN_ID" \
            --arg image_os "$ImageOS" \
            --arg image_version "$ImageVersion" \
            --arg architecture "$RUNNER_ARCH" \
            --arg proof_image "$PROOF_IMAGE" \
            --argjson exit_code "$(cat "$RUNNER_TEMP/stage.exit")" \
            --arg log_sha256 "$(sha256sum "$out/stage.log" | cut -d' ' -f1)" \
            --argjson proof_exit_code "$(cat "$RUNNER_TEMP/proof.exit")" \
            --arg proof_log_sha256 "$(sha256sum "$out/proof.log" | cut -d' ' -f1)" \
            --slurpfile artifacts "$RUNNER_TEMP/artifacts.json" \
            --slurpfile proof_artifacts "$RUNNER_TEMP/proof-artifacts.json" \
            '{challenge: $challenge, source_commit: $source_commit, source: $source,
              archive_sha256: $archive_sha256, transport_asset: $transport_asset, tree: $tree,
              run_id: $run_id, image_os: $image_os, image_version: $image_version,
              architecture: $architecture, proof_image: $proof_image, exit_code: $exit_code,
              log_sha256: $log_sha256, proof_exit_code: $proof_exit_code,
              proof_log_sha256: $proof_log_sha256, artifacts: $artifacts[0],
              proof_artifacts: $proof_artifacts[0]}' > "$out/result.json"

      - name: Publish result, log, and staged output
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: linux-${{ inputs.challenge }}
          path: ${{ runner.temp }}/linux-${{ inputs.challenge }}
          if-no-files-found: error
          retention-days: 1

      # The release's Darwin and Windows stages link this run's canvas instead
      # of compiling their own app. Like every run artifact, the digest-named
      # canvas persists until its retention expires it.
      - name: Collect staged canvas
        id: canvas
        run: |
          set -euo pipefail
          [[ "$(cat "$RUNNER_TEMP/stage.exit")" == 0 ]] || exit 0
          payload=dist/stage/targets/x86_64-unknown-linux-musl/payload.json
          canvas="$RUNNER_TEMP/canvas"
          mkdir -p "$canvas/targets/x86_64-unknown-linux-musl" "$canvas/objects"
          cp "$payload" "$canvas/targets/x86_64-unknown-linux-musl/payload.json"
          jq -r '.inventory[] | "\(.digest) \(.mode)"' "$payload" \
            | while read -r digest mode; do
                object="$(printf '%s-%04o' "$digest" "$mode")"
                cp "dist/stage/objects/$object" "$canvas/objects/$object"
              done
          echo "name=canvas-$(jq -r .canvas "$payload")" >> "$GITHUB_OUTPUT"

      - name: Publish staged canvas
        if: steps.canvas.outputs.name != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.canvas.outputs.name }}
          path: ${{ runner.temp }}/canvas
          if-no-files-found: error
          retention-days: 7

  attest:
    name: Sign result with GitHub OIDC identity
    needs: stage
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      attestations: write
      id-token: write
    steps:
      - name: Download result
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: linux-${{ inputs.challenge }}
          path: ${{ runner.temp }}/result

      - name: Sign result, proof, and staged files
        uses: actions/attest-build-provenance@62fc1d596301d0ab9914e1fec14dc5c8d93f65cd
        with:
          subject-path: |
            ${{ runner.temp }}/result/result.json
            ${{ runner.temp }}/result/proof.log
            ${{ runner.temp }}/result/proof/**
            ${{ runner.temp }}/result/stage/**
