name: Proof image preparation
run-name: Proof image preparation ${{ github.sha }}

on:
  push:
    branches: [main]
    paths:
      - .cargo/config.toml
      - .github/workflows/proof-image.yml
      - .github/scripts/proof-image-build-key.sh
      - Cargo.lock
      - dist/proof-image/**
      - rust-toolchain.toml
      - prepared/**
      - xtask/src/proof_image.rs
      - proof/**
      - vendor-set/**
      - xtask/Cargo.toml
      - xtask/src/lib.rs
      - xtask/src/main.rs
      - xtask/src/prepared_artifact.rs
      - wire/src/manifest.rs
  workflow_dispatch:

permissions: {}

jobs:
  publish:
    name: Publish proof image
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up cache-capable Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435
        with:
          driver: docker-container

      - name: Expose GitHub cache runtime
        uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487

      - name: Restore derivable producer environment
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: |
            ${{ runner.temp }}/bootstrap-cargo
            ${{ runner.temp }}/bootstrap-target
          key: proof-producer-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', '.cargo/config.toml') }}
      - name: Install exact ORAS
        uses: oras-project/setup-oras@ac735097e22fe643015b0d19645f7c9a69942128
        with:
          version: 1.3.0

      - name: Build repository-owned producer
        env:
          CARGO_HOME: ${{ runner.temp }}/bootstrap-cargo
          CARGO_TARGET_DIR: ${{ runner.temp }}/bootstrap-target
        run: |
          set -euo pipefail
          rustup toolchain install --no-self-update
          cargo build --locked --package xtask

      - name: Derive immutable image key
        id: prepared
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/prepared"
          mkdir -p "$root"
          xtask="$RUNNER_TEMP/bootstrap-target/debug/xtask"
          .github/scripts/proof-image-build-key.sh "$root/build-key.json"
          key="$($xtask prepared-artifact build-key "$root/build-key.json" | sed -n 's/^build key sha256://p')"
          [[ "$key" =~ ^[0-9a-f]{64}$ ]]
          echo "key=$key" >> "$GITHUB_OUTPUT"

      - name: Admit existing proof image or authorize publication
        id: remote
        env:
          GHCR_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          xtask="$RUNNER_TEMP/bootstrap-target/debug/xtask"
          repository="ghcr.io/${GITHUB_REPOSITORY,,}/prepared"
          key='${{ steps.prepared.outputs.key }}'
          reference="$repository:proof-$key"
          expected_key="sha256:$key"
          printf '%s' "$GHCR_TOKEN" | oras login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          resolution="$("$xtask" prepared-artifact resolve-image-if-present \
            "$reference" "$expected_key")"
          echo "reference=$reference" >> "$GITHUB_OUTPUT"
          if [[ "$resolution" == absent ]]; then
            echo "publish=1" >> "$GITHUB_OUTPUT"
          else
            read -r label manifest config identity <<< "$resolution"
            test "$label" = resolved
            test "$config" = "$identity"
            echo "publish=0" >> "$GITHUB_OUTPUT"
            echo "identity=$identity" >> "$GITHUB_OUTPUT"
          fi

      - name: Build, admit, and publish proof image
        id: image
        env:
          CARGO_HOME: ${{ runner.temp }}/bootstrap-cargo
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/prepared"
          mkdir -p "$root"
          archive="$root/proof-image.tar"
          xtask="$RUNNER_TEMP/bootstrap-target/debug/xtask"
          "$xtask" proof-image build \
            --cache-from 'type=gha,scope=proof-image-linux-amd64' \
            --cache-to 'type=gha,mode=max,scope=proof-image-linux-amd64,ignore-error=true' \
            --build-key 'sha256:${{ steps.prepared.outputs.key }}' \
            "$archive" | tee "$root/build.out"
          identity="$(sed -n 's/^proof image //p' "$root/build.out")"
          [[ "$identity" =~ ^sha256:[0-9a-f]{64}$ ]]
          if [[ '${{ steps.remote.outputs.publish }}' == 0 ]]; then
            test "$identity" = '${{ steps.remote.outputs.identity }}'
          else
            vendor_set="$("$xtask" prepared-artifact vendor-set Cargo.lock \
              | sed -n 's/^vendor set //p')"
            [[ "$vendor_set" =~ ^sha256:[0-9a-f]{64}$ ]]
            docker buildx build \
              --output 'type=registry,name=${{ steps.remote.outputs.reference }},compression=gzip' \
              --platform linux/amd64 \
              --provenance=false \
              --sbom=false \
              --build-arg "spice_vendor_set=$vendor_set" \
              --label 'org.spice.build-key=sha256:${{ steps.prepared.outputs.key }}' \
              "$GITHUB_WORKSPACE/target/proof-image/context"
          fi
          echo "identity=$identity" >> "$GITHUB_OUTPUT"

      - name: Admit immutable layered proof image
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/prepared"
          xtask="$RUNNER_TEMP/bootstrap-target/debug/xtask"
          reference='${{ steps.remote.outputs.reference }}'
          expected_key='sha256:${{ steps.prepared.outputs.key }}'
          expected_identity='${{ steps.image.outputs.identity }}'
          read -r label manifest config identity < <(
            "$xtask" prepared-artifact resolve-image "$reference" "$expected_key"
          )
          test "$label" = resolved
          [[ "$manifest" =~ ^sha256:[0-9a-f]{64}$ ]]
          test "$config" = "$expected_identity"
          test "$identity" = "$expected_identity"
          rm -f "$root/proof-image.tar" "$root/proof-image.tar.sha256" \
            "$root/proof-image.tar.identity"
          docker logout ghcr.io
          oras logout ghcr.io
