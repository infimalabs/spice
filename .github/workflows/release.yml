name: Complete release
run-name: Complete release from ${{ github.sha }}

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Exact landed main commit admitted with the local journal
        required: true
        type: string
      notes:
        description: Complete curated release-notes record admitted by the local journal
        required: true
        type: string
      notes_identity:
        description: Domain-separated identity of the exact release-note document
        required: true
        type: string
      stage_only:
        description: Stage and prove every target, then stop before any tag or release
        required: false
        default: false
        type: boolean
      release_symbols:
        description: Start detached authenticated symbol rebuilds after canonical publication
        required: false
        default: false
        type: boolean

permissions: {}

concurrency:
  group: complete-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    name: Prepare, prove, sign, and publish
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      actions: write
      attestations: read
      contents: write
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out the coordinator revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Admit the explicit landed request
        shell: bash
        env:
          REQUESTED_SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/main
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          [[ "$REQUESTED_SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test "$REQUESTED_SOURCE_COMMIT" = "$GITHUB_SHA"
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main

      - name: Restore prior attempt authority
        id: state
        shell: bash
        run: |
          set -euo pipefail
          authority="$(git rev-parse --git-common-dir)/.spice/authority"
          test ! -e "$authority/releases"
          restored=0
          if ((GITHUB_RUN_ATTEMPT > 1)); then
            best_attempt=0
            best_name=
            while IFS= read -r name; do
              case "$name" in
                "release-state-$GITHUB_RUN_ID-"*)
                  attempt=${name##*-}
                  if [[ "$attempt" =~ ^[0-9]+$ ]] \
                    && ((attempt < GITHUB_RUN_ATTEMPT && attempt > best_attempt)); then
                    best_attempt=$attempt
                    best_name=$name
                  fi
                  ;;
              esac
            done < <(gh api --paginate \
              "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" \
              --jq '.artifacts[] | select(.expired == false) | .name')
            if test -z "$best_name"; then
              echo "rerun has no admitted prior-attempt release authority" >&2
              exit 65
            fi
            download="$RUNNER_TEMP/release-state-download"
            mkdir -p "$download" "$authority"
            gh run download "$GITHUB_RUN_ID" --name "$best_name" --dir "$download"
            python3 - "$download/release-state.tar.gz" "$authority" <<'PY'
          import pathlib, sys, tarfile
          archive, destination = sys.argv[1:]
          with tarfile.open(archive, "r:gz") as source:
              members = source.getmembers()
              for member in members:
                  path = pathlib.PurePosixPath(member.name)
                  if path.is_absolute() or not path.parts or path.parts[0] != "releases":
                      raise SystemExit(f"release state escaped its root: {member.name}")
                  if any(part in ("", ".", "..") for part in path.parts):
                      raise SystemExit(f"release state used a non-canonical path: {member.name}")
                  if not (member.isfile() or member.isdir()):
                      raise SystemExit(f"release state carried a non-file entry: {member.name}")
              source.extractall(destination, members=members)
          PY
            restored=1
          fi
          printf 'restored=%s\n' "$restored" >> "$GITHUB_OUTPUT"

      - name: Restore derivable coordinator environment
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: |
            ${{ runner.temp }}/coordinator-cargo
            ${{ runner.temp }}/coordinator-target
          key: release-coordinator-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', '.cargo/config.toml') }}

      - name: Install exact Rust and ORAS
        uses: oras-project/setup-oras@ac735097e22fe643015b0d19645f7c9a69942128
        with:
          version: 1.3.0

      - name: Build the repository-owned coordinator
        shell: bash
        env:
          CARGO_HOME: ${{ runner.temp }}/coordinator-cargo
          CARGO_TARGET_DIR: ${{ runner.temp }}/coordinator-target
        run: |
          set -euo pipefail
          native_rustup="$(command -v rustup)"
          test -x "$native_rustup"
          bootstrap_cargo_home="${native_rustup%/bin/rustup}"
          test "$bootstrap_cargo_home/bin/rustup" -ef "$native_rustup"
          test "$bootstrap_cargo_home" != "$native_rustup"
          printf 'SPICE_BOOTSTRAP_CARGO_HOME=%s\n' "$bootstrap_cargo_home" >> "$GITHUB_ENV"
          rustup toolchain install --no-self-update
          cargo build --locked --package xtask

      - name: Admit the dispatched release notes record
        shell: bash
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/coordinator-target
          RELEASE_NOTES_RECORD: ${{ inputs.notes }}
          RELEASE_NOTES_IDENTITY: ${{ inputs.notes_identity }}
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/release-notes.json"
          printf '%s' "$RELEASE_NOTES_RECORD" > "$notes"
          "$CARGO_TARGET_DIR/debug/xtask" admit-hosted-release-notes \
            "$notes" "$GITHUB_SHA" "$RELEASE_NOTES_IDENTITY"

      - name: Install the pinned Linux xwin
        shell: bash
        run: |
          set -euo pipefail
          # dist/windows/xwin-hosted.toml pins this binary's bytes at this path; the
          # archive digest is upstream's published checksum.
          version=0.10.0
          name="xwin-$version-x86_64-unknown-linux-musl"
          archive="$RUNNER_TEMP/$name.tar.gz"
          curl -fsSL -o "$archive" \
            "https://github.com/Jake-Shadle/xwin/releases/download/$version/$name.tar.gz"
          printf '%s  %s\n' d870eb4b2f390878af6da1ccd3cf321d22fcb72720984853b4be732ae597fc88 "$archive" \
            | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          sudo install -D -m 0755 "$RUNNER_TEMP/$name/xwin" "/opt/spice/xwin/$version/xwin"

      - name: Record the Microsoft CRT and Windows SDK licence acceptance
        shell: bash
        env:
          WINDOWS_MSVC_ACCEPTANCE: ${{ secrets.WINDOWS_MSVC_ACCEPTANCE }}
        run: |
          set -euo pipefail
          test -n "$WINDOWS_MSVC_ACCEPTANCE"
          jq -rn --arg statement "$WINDOWS_MSVC_ACCEPTANCE" \
            '"statement = \($statement | tojson)"' > dist/windows/msvc.local.toml

      - name: Select the Docker proof runtime
        shell: bash
        run: |
          set -euo pipefail
          # The Windows stage loads the proof image its admitted inputs name
          # once the input run has prepared it.
          common="$(git rev-parse --git-common-dir)"
          mkdir -p "$common/.spice"
          printf '[proof]\ncontainer = "%s"\n' "$(command -v docker)" > "$common/.spice/config.toml"

      - name: Resume or run the complete release
        shell: bash
        env:
          CARGO_HOME: ${{ runner.temp }}/coordinator-cargo
          CARGO_TARGET_DIR: ${{ runner.temp }}/coordinator-target
          STAGE_ONLY: ${{ inputs.stage_only }}
        run: |
          set -euo pipefail
          xtask="$CARGO_TARGET_DIR/debug/xtask"
          notes="$RUNNER_TEMP/release-notes.json"
          publications="$(git rev-parse --git-common-dir)/.spice/authority/releases/publication"
          complete="$publications/coordinator-complete.json"
          pending="$publications/pending.json"
          mkdir -p "$publications"
          if test "$STAGE_ONLY" = true; then
            # A staged request stays pinned for this run's reruns; it never
            # reaches a tag, a release, or the completion marker.
            test ! -e "$complete"
            if test -f "$pending"; then
              source_commit=$(jq -r .source_commit "$pending")
              [[ "$source_commit" =~ ^[0-9a-f]{40}$ ]]
              "$xtask" publish-hosted-release "$source_commit" --admitted-notes "$notes" --stage-only
            else
              "$xtask" publish-hosted-release --admitted-notes "$notes" --stage-only
            fi
            printf '### Staged release\n\n- source commit: `%s`\n' \
              "$(jq -r .source_commit "$pending")" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          plans=()
          while IFS= read -r plan; do plans+=("$plan"); done \
            < <(find "$publications" -mindepth 2 -maxdepth 2 -name plan.json -type f -print)
          if test -f "$complete"; then
            test "$(jq -r .schema "$complete")" = 1
            source_commit=$(jq -r .source_commit "$complete")
            tag=$(jq -r .tag "$complete")
            plan="$publications/$source_commit/plan.json"
          else
            if test -f "$pending"; then
              source_commit=$(jq -r .source_commit "$pending")
              [[ "$source_commit" =~ ^[0-9a-f]{40}$ ]]
              "$xtask" publish-hosted-release "$source_commit" --admitted-notes "$notes"
            elif test "${#plans[@]}" = 0; then
              "$xtask" publish-hosted-release --admitted-notes "$notes"
            elif test "${#plans[@]}" = 1 \
              && test ! -e "$(dirname "${plans[0]}")/unpublished"; then
              # The publisher removes pending.json only after fresh public
              # readback. Recover a run interrupted before this workflow wrote
              # its own completion marker without publishing again.
              :
            else
              echo "release authority has neither a resumable pin nor one completed plan" >&2
              exit 65
            fi
            test ! -e "$pending"
            plans=()
            while IFS= read -r plan_path; do plans+=("$plan_path"); done \
              < <(find "$publications" -mindepth 2 -maxdepth 2 -name plan.json -type f -print)
            test "${#plans[@]}" = 1
            plan="${plans[0]}"
            source_commit=$(jq -r .source_commit "$plan")
            tag=$(jq -r .tag "$plan")
          fi
          [[ "$source_commit" =~ ^[0-9a-f]{40}$ ]]
          test -n "$tag"
          test "$(jq -r .source_commit "$plan")" = "$source_commit"
          test "$(jq -r .tag "$plan")" = "$tag"
          notes_sha256=$(sha256sum "$notes" | cut -d' ' -f1)
          plan_sha256=$(sha256sum "$plan" | cut -d' ' -f1)
          if test -f "$complete"; then
            test "$(jq -r .notes_sha256 "$complete")" = "$notes_sha256"
            test "$(jq -r .plan_sha256 "$complete")" = "$plan_sha256"
          fi
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" \
            --json tagName,url,isDraft,isPrerelease,publishedAt,targetCommitish \
            > "$RUNNER_TEMP/release-readback.json"
          test "$(jq -r .tagName "$RUNNER_TEMP/release-readback.json")" = "$tag"
          test "$(jq -r .isDraft "$RUNNER_TEMP/release-readback.json")" = false
          if test ! -f "$complete"; then
            jq -n --sort-keys --arg source_commit "$source_commit" --arg tag "$tag" \
              --arg notes_sha256 "$notes_sha256" --arg plan_sha256 "$plan_sha256" \
              --argjson run_id "$GITHUB_RUN_ID" --argjson run_attempt "$GITHUB_RUN_ATTEMPT" \
              '{schema:1,source_commit:$source_commit,tag:$tag,notes_sha256:$notes_sha256,plan_sha256:$plan_sha256,run_id:$run_id,run_attempt:$run_attempt}' \
              > "$complete.tmp"
            mv "$complete.tmp" "$complete"
          fi
          jq -n --sort-keys --arg source_commit "$source_commit" --arg tag "$tag" \
            --arg plan_sha256 "$plan_sha256" \
            --slurpfile release "$RUNNER_TEMP/release-readback.json" \
            '{schema:1,source_commit:$source_commit,tag:$tag,plan_sha256:$plan_sha256,release:$release[0]}' \
            > "$RUNNER_TEMP/final-release.json"
          {
            printf '### Complete release\n\n'
            printf -- '- source commit: `%s`\n' "$source_commit"
            printf -- '- tag: `%s`\n' "$tag"
            printf -- '- release: %s\n' "$(jq -r .url "$RUNNER_TEMP/release-readback.json")"
            printf -- '- restored coordinator authority: `%s`\n' '${{ steps.state.outputs.restored }}'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Pack attempt-scoped coordinator authority
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          authority="$(git rev-parse --git-common-dir)/.spice/authority"
          mkdir -p "$authority/releases"
          tar -czf "$RUNNER_TEMP/release-state.tar.gz" -C "$authority" releases

      - name: Preserve attempt-scoped coordinator authority
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-state-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-state.tar.gz
          if-no-files-found: error
          retention-days: 7

      - name: Publish the final release result
        if: ${{ success() && !inputs.stage_only }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-result-${{ github.run_id }}
          path: ${{ runner.temp }}/final-release.json
          if-no-files-found: error
          overwrite: true
          retention-days: 30

      - name: Start detached symbol rebuilds
        if: ${{ success() && inputs.release_symbols && !inputs.stage_only }}
        shell: bash
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source_commit="$(jq -r .source_commit "$RUNNER_TEMP/final-release.json")"
          [[ "$source_commit" =~ ^[0-9a-f]{40}$ ]]
          for target in \
            aarch64-apple-darwin \
            x86_64-unknown-linux-musl \
            x86_64-pc-windows-msvc
          do
            gh workflow run symbols.yml --repo "$GITHUB_REPOSITORY" --ref main \
              -f release_run="$GITHUB_RUN_ID" \
              -f source_commit="$source_commit" \
              -f target="$target"
          done
