name: macOS staging
run-name: macOS staging ${{ inputs.challenge }}

on:
  workflow_dispatch:
    inputs:
      challenge:
        description: Unique lowercase 64-hex execution challenge
        required: true
        type: string
      source_commit:
        description: Canonical source commit recorded by source.tar
        required: true
        type: string
      source:
        description: Canonical source-archive identity
        required: true
        type: string
      archive_sha256:
        description: Raw SHA-256 of source.tar
        required: true
        type: string
      release_inputs_run:
        description: Provider run that produced the canonical release inputs
        required: true
        type: string
      release_inputs_challenge:
        description: Challenge naming the canonical release-input artifact
        required: true
        type: string
      app:
        description: Canonical app generation
        required: true
        type: string
      tree:
        description: Exact canonical source tree digest
        required: true
        type: string
      proof_build_key:
        description: Complete prepared proof-image build key
        required: true
        type: string
      proof_manifest:
        description: Immutable prepared proof-image OCI manifest
        required: true
        type: string
      proof_container:
        description: Exact admitted vendor-set proof image
        required: true
        type: string
      canvas:
        description: Digest of the provider-built canvas this stage links
        required: true
        type: string
      prepared_build_key:
        description: Complete finalized macOS bundle build key
        required: true
        type: string
      prepared_inputs:
        description: Canonical finalized macOS bundle build-key inputs
        required: true
        type: string

jobs:

  stage:
    name: Stage macOS
    runs-on: macos-15
    timeout-minutes: 90
    permissions:
      actions: read
      packages: write
    steps:
      - name: Download input
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: input-${{ inputs.release_inputs_challenge }}
          run-id: ${{ inputs.release_inputs_run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/input

      - name: Admit canonical release inputs
        shell: bash
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          SOURCE: ${{ inputs.source }}
          ARCHIVE_SHA256: ${{ inputs.archive_sha256 }}
          INPUTS_RUN: ${{ inputs.release_inputs_run }}
          INPUTS_CHALLENGE: ${{ inputs.release_inputs_challenge }}
          APP: ${{ inputs.app }}
          CANVAS: ${{ inputs.canvas }}
          PROOF_BUILD_KEY: ${{ inputs.proof_build_key }}
          PROOF_MANIFEST: ${{ inputs.proof_manifest }}
          PROOF_IDENTITY: ${{ inputs.proof_container }}
          TREE: ${{ inputs.tree }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/input"
          result="$root/result.json"
          test "$(jq -r .challenge "$result")" = "$INPUTS_CHALLENGE"
          test "$(jq -r .run_id "$result")" = "$INPUTS_RUN"
          test "$(jq -r .source_commit "$result")" = "$SOURCE_COMMIT"
          test "$(jq -r .source "$result")" = "$SOURCE"
          test "$(jq -r .archive_sha256 "$result")" = "$ARCHIVE_SHA256"
          test "$(jq -r .tree "$result")" = "$TREE"
          test "$(jq -r .app "$result")" = "$APP"
          test "$(jq -r .canvas "$result")" = "$CANVAS"
          test "$(jq -r .proof_build_key "$result")" = "$PROOF_BUILD_KEY"
          test "$(jq -r .proof_manifest "$result")" = "$PROOF_MANIFEST"
          test "$(jq -r .proof_identity "$result")" = "$PROOF_IDENTITY"
          archive="$root/source.tar"
          test "$(shasum -a 256 "$archive" | cut -d' ' -f1)" = "$ARCHIVE_SHA256"
          find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          # Extraction stamps sources with the current time rather than the
          # commit time, so a restored bootstrap target never mistakes them for
          # older than a previous commit's build.
          tar -xmf "$archive" --strip-components=1 -C "$GITHUB_WORKSPACE"
          test "$(python3 -c 'import json; print(json.load(open("dist/build.json"))["source"]["commit"])')" = "$SOURCE_COMMIT"
          git init -q
          git config core.autocrlf false
          git config user.name spice-hosted
          git config user.email hosted@invalid
          git add -A -f -- .
          GIT_AUTHOR_DATE=2000-01-01T00:00:00Z GIT_COMMITTER_DATE=2000-01-01T00:00:00Z \
            git commit -q -m "canonical source $SOURCE_COMMIT"
          test "$(git ls-tree -r -z --full-tree HEAD | shasum -a 256 | cut -d' ' -f1)" = "$TREE"
      - name: Admit request
        shell: bash
        env:
          EXPECTED_SOURCE: ${{ inputs.source_commit }}
          EXPECTED_ARCHIVE: ${{ inputs.source }}
          PROOF_CONTAINER: ${{ inputs.proof_container }}
          CHALLENGE: ${{ inputs.challenge }}
          CANVAS: ${{ inputs.canvas }}
        run: |
          set -euo pipefail
          case "$CHALLENGE" in *[!0-9a-f]*|'') exit 65 ;; esac
          test "${#CHALLENGE}" -eq 64
          case "$EXPECTED_SOURCE" in *[!0-9a-f]*|'') exit 65 ;; esac
          test "${#EXPECTED_SOURCE}" -eq 40 -o "${#EXPECTED_SOURCE}" -eq 64
          case "$EXPECTED_ARCHIVE" in *[!0-9a-f]*|'') exit 65 ;; esac
          test "${#EXPECTED_ARCHIVE}" -eq 64
          case "$PROOF_CONTAINER" in sha256:*) ;; *) exit 65 ;; esac
          proof_digest=${PROOF_CONTAINER#sha256:}
          case "$proof_digest" in *[!0-9a-f]*|'') exit 65 ;; esac
          test "${#proof_digest}" -eq 64
          case "$CANVAS" in *[!0-9a-f]*|'') exit 65 ;; esac
          test "${#CANVAS}" -eq 64

      - name: Admit runner image and install exact tools
        uses: ./.github/actions/macos-toolchain

      - name: Install exact ORAS
        uses: oras-project/setup-oras@ac735097e22fe643015b0d19645f7c9a69942128
        with:
          version: 1.3.0

      # The provider cache carries registry sources only. Compiled dependency
      # authority comes from the admitted OCI layer below, never this mutable
      # optimization surface.
      - name: Restore derivable registry sources
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: ${{ runner.temp }}/release-cargo
          key: macos-registry-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', '.cargo/config.toml') }}

      - name: Restore exact unsigned candidate prebuild
        uses: ./.github/actions/macos-candidate-prebuild
        id: candidate_prebuild
        with:
          source_commit: ${{ inputs.source_commit }}
          source: ${{ inputs.source }}
          tree: ${{ inputs.tree }}
          archive_sha256: ${{ inputs.archive_sha256 }}
          cargo_home: ${{ runner.temp }}/release-cargo
          target_dir: ${{ runner.temp }}/release-target
          token: ${{ github.token }}

      - name: Restore admitted native dependency layer
        if: steps.candidate_prebuild.outputs.hit != '1'
        shell: bash
        env:
          CARGO_HOME: ${{ runner.temp }}/release-cargo
          CARGO_TARGET_DIR: ${{ runner.temp }}/release-target
          GHCR_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          RUSTUP_TOOLCHAIN: 1.97.1-aarch64-apple-darwin
        run: |
          set -euo pipefail
          cargo="$RUST_BIN/cargo"
          prepared="$PREPARED_ARTIFACT_TOOL"
          test -x "$prepared"

          digest_text() {
            shasum -a 256 | cut -d' ' -f1 | sed 's/^/sha256:/'
          }
          root="$RUNNER_TEMP/native-dependencies"
          mkdir -p "$root"
          vendor=$("$prepared" vendor-set Cargo.lock | sed -n 's/^vendor set //p')
          vendor_hex=${vendor#sha256:}
          case "$vendor_hex" in *[!0-9a-f]*|'') exit 65 ;; esac
          test "${#vendor_hex}" -eq 64
          target=$(printf '%s' 'aarch64-apple-darwin' | digest_text)
          rust=$("$RUST_BIN/rustc" -vV | digest_text)
          cargo_identity=$("$cargo" -Vv | digest_text)
          lock="sha256:$(shasum -a 256 Cargo.lock | cut -d' ' -f1)"
          cargo_config="sha256:$(shasum -a 256 .cargo/config.toml | cut -d' ' -f1)"
          candidate="sha256:$(shasum -a 256 dist/release/candidate.toml | cut -d' ' -f1)"
          features=$(printf '%s' 'xtask:default;spice:canvas;proof:default' | digest_text)
          # Cargo.lock records no feature selection, and the root manifest
          # alone owns profiles: the resolved third-party feature plan and the
          # release profile key the layer so either change republishes it.
          resolved=$("$cargo" metadata --locked --format-version 1 \
            --filter-platform aarch64-apple-darwin --features spice/canvas \
            | jq -c --sort-keys '.workspace_members as $members
              | [.resolve.nodes[] | select(.id as $id | $members | index($id) | not)
              | {id, features}] | sort_by(.id)' \
            | digest_text)
          profile=$(python3 -c 'import json, tomllib; print(json.dumps(tomllib.load(open("Cargo.toml", "rb")).get("profile", {}).get("release", {}), sort_keys=True))' \
            | digest_text)
          sdk=$(printf '%s\n%s\n%s' "$EXPECTED_SDK" "$EXPECTED_XCODE_BUILD" "$DEVELOPER_DIR" | digest_text)
          contract=$(cat prepared/Cargo.toml prepared/src/lib.rs \
            dist/proof-runner/build.sh .github/actions/macos-unsigned-stage/action.yml \
            .github/workflows/macos.yml | digest_text)
          jq -n --sort-keys \
            --arg target "$target" --arg rust "$rust" --arg cargo "$cargo_identity" \
            --arg lock "$lock" --arg cargo_config "$cargo_config" \
            --arg candidate "$candidate" --arg features "$features" --arg sdk "$sdk" \
            --arg resolved "$resolved" --arg profile "$profile" \
            --arg vendor "$vendor" --arg contract "$contract" \
            '{target:$target,rust:$rust,cargo:$cargo,lock:$lock,cargo_config:$cargo_config,candidate:$candidate,features:$features,resolved:$resolved,profile:$profile,sdk:$sdk,vendor:$vendor,contract:$contract}' \
            > "$root/build-key.json"
          key=$("$prepared" build-key "$root/build-key.json" | sed -n 's/^build key //p')
          test -n "$key"
          tag="${key#sha256:}"
          case "$tag" in *[!0-9a-f]*|'') exit 65 ;; esac
          test "${#tag}" -eq 64
          repository=$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
          repository="ghcr.io/$repository/prepared"
          # The credential lives only for this lookup; the sealed stage below
          # builds and runs third-party and repository code without it.
          printf '%s' "$GHCR_TOKEN" \
            | oras login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          trap 'oras logout ghcr.io' EXIT

          # A canonically absent layer builds cold. Resolver failures refuse;
          # a resolved layer that fails byte or record admission builds cold
          # without overwriting its occupied discovery tag.
          admit_restored() {
            local record="$root/restored/record.json"
            test "$(jq -r .schema "$record")" = 1 \
              && test "$(jq -r .build_key "$record")" = "$key" \
              && baseline=$(jq -r .cold_build_seconds "$record") \
              && [[ "$baseline" =~ ^[0-9]+$ ]] \
              && test -d "$root/restored/target/release-appliance" \
              && test -d "$root/restored/target/release-appliance-build" \
              && test -d "$root/restored/target/proof-native-dependencies" \
              && test -d "$root/restored/proof-native-darwin/vendor"
          }
          hit=0
          present=0
          manifest=-
          baseline=0
          : > "$root/resolve.err"
          if resolved_layer=$("$prepared" resolve-if-present \
            "$repository:$tag" "$key" 2>"$root/resolve.err"); then
            :
          else
            status=$?
            cat "$root/resolve.err" >&2
            exit "$status"
          fi
          case "$resolved_layer" in
            absent)
              ;;
            resolved\ *)
              present=1
              read -r label manifest _ <<< "$resolved_layer"
              test "$label" = resolved
              if "$prepared" fetch-extract "$repository@$manifest" "$key" "$root/restored" \
                && admit_restored; then
                mkdir -p "$CARGO_TARGET_DIR"
                # Cargo freshness is an ordering relation between dependency
                # outputs, dependent outputs, and fingerprint markers. The
                # cache archive preserves those mtimes; copy them intact.
                cp -pR "$root/restored/target/." "$CARGO_TARGET_DIR/"
                mkdir -p "$GITHUB_WORKSPACE/target/proof-native-darwin"
                cp -pR "$root/restored/proof-native-darwin/vendor" \
                  "$GITHUB_WORKSPACE/target/proof-native-darwin/"
                hit=1
              else
                echo "prepared layer $manifest refused; building cold" >&2
                baseline=0
              fi
              ;;
            *)
              echo "prepared resolver returned malformed output: $resolved_layer" >&2
              exit 65
              ;;
          esac
          if test "$hit" = 0; then
            rm -rf "$CARGO_TARGET_DIR" "$root/restored"
            mkdir -p "$CARGO_TARGET_DIR"
          fi
          {
            printf 'PREPARED_ARTIFACT_TOOL=%s\n' "$prepared"
            printf 'DEPENDENCY_BUILD_KEY_FILE=%s\n' "$root/build-key.json"
            printf 'DEPENDENCY_BUILD_KEY=%s\n' "$key"
            printf 'DEPENDENCY_REPOSITORY=%s\n' "$repository"
            printf 'DEPENDENCY_TAG=%s\n' "$tag"
            printf 'DEPENDENCY_MANIFEST=%s\n' "$manifest"
            printf 'DEPENDENCY_HIT=%s\n' "$hit"
            printf 'DEPENDENCY_BASELINE_SECONDS=%s\n' "$baseline"
            printf 'DEPENDENCY_PRESENT=%s\n' "$present"
          } >> "$GITHUB_ENV"

      - name: Mark native build start
        shell: bash
        run: printf 'NATIVE_BUILD_STARTED=%s\n' "$(date +%s)" >> "$GITHUB_ENV"

      - name: Build and execute the sealed unsigned stage
        uses: ./.github/actions/macos-unsigned-stage
        with:
          cargo-home: ${{ runner.temp }}/release-cargo
          target-dir: ${{ runner.temp }}/release-target
          archive: ${{ inputs.source }}
          proof-container: ${{ inputs.proof_container }}
          canvas: ${{ runner.temp }}/input/canvas.zip
          app: ${{ inputs.app }}
          proof-dependencies-restored: ${{ env.CANDIDATE_PREBUILD_HIT == '1' || env.DEPENDENCY_HIT == '1' }}

      - name: Record native build duration
        shell: bash
        run: |
          set -euo pipefail
          build_seconds=$(($(date +%s) - NATIVE_BUILD_STARTED))
          printf 'DEPENDENCY_BUILD_SECONDS=%s\n' "$build_seconds" >> "$GITHUB_ENV"
          if test "$CANDIDATE_PREBUILD_HIT" = 1; then
            {
              printf '### macOS candidate rebind\n\n'
              printf -- '- Cargo freshness, canvas relink, and sealed stage: `%ss`\n' \
                "$build_seconds"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Publish or record native dependency layer
        if: steps.candidate_prebuild.outputs.hit != '1'
        shell: bash
        env:
          CARGO_HOME: ${{ runner.temp }}/release-cargo
          CARGO_TARGET_DIR: ${{ runner.temp }}/release-target
          GHCR_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          RUSTUP_TOOLCHAIN: 1.97.1-aarch64-apple-darwin
        run: |
          set -euo pipefail
          manifest="$DEPENDENCY_MANIFEST"
          publication=reused
          if test "$DEPENDENCY_HIT" = 0 && test "$DEPENDENCY_PRESENT" = 1; then
            # The tag already names content this run refused; never publish
            # over it.
            publication='unpublished: the tag names a refused layer'
          fi
          if test "$DEPENDENCY_HIT" = 0 && test "$DEPENDENCY_PRESENT" = 0; then
            python=$(command -v python3)
            cargo="$RUST_BIN/cargo"
            release_target="$CARGO_TARGET_DIR/$("$python" -c \
              'import tomllib; print(tomllib.load(open("dist/release/candidate.toml", "rb"))["target_dir"])')"
            build_dir="$CARGO_TARGET_DIR/$("$python" -c \
              'import tomllib; print(tomllib.load(open("dist/release/candidate.toml", "rb"))["build_dir"])')"
            proof_target="$CARGO_TARGET_DIR/proof-native-dependencies"
            debug_config=$("$python" -c \
              'import tomllib; print(tomllib.load(open("dist/release/candidate.toml", "rb"))["debug_config"])')
            candidate_env=()
            while IFS= read -r assignment; do
              candidate_env+=("$assignment")
            done < <("$python" - "$(pwd -P)" "$CARGO_TARGET_DIR" <<'PY'
          import os, sys, tomllib
          workspace, build_root = sys.argv[1:]
          with open("dist/release/candidate.toml", "rb") as source:
              candidate = tomllib.load(source)
          for name, value in candidate["environment"].items():
              print(f"{name}={value}")
          print("CARGO_BUILD_BUILD_DIR=" + os.path.join(build_root, candidate["build_dir"]))
          print("CARGO_ENCODED_RUSTFLAGS=" + candidate["rustflags"].replace("{workspace}", workspace))
          PY
            )
            packages=()
            while IFS= read -r package; do
              packages+=(--package "$package")
            done < <("$cargo" metadata --locked --no-deps --format-version 1 \
              | jq -r '.workspace_members[] as $id | .packages[] | select(.id == $id) | .name')
            env "${candidate_env[@]}" "$cargo" clean --release \
              --target aarch64-apple-darwin --target-dir "$release_target" \
              --config "$debug_config" "${packages[@]}"
            "$cargo" clean --release --target-dir "$proof_target" "${packages[@]}"

            root="$RUNNER_TEMP/native-dependencies/publish"
            mkdir -p "$root/target" "$root/proof-native-darwin"
            mv "$release_target" "$root/target/release-appliance"
            mv "$build_dir" "$root/target/release-appliance-build"
            mv "$proof_target" "$root/target/proof-native-dependencies"
            cp -pR "$GITHUB_WORKSPACE/target/proof-native-darwin/vendor" \
              "$root/proof-native-darwin/"
            # Cold hosted run 45989936318 spent 23m30s in this native build.
            # Keep the reference fixed so the prepared payload is idempotent.
            jq -n --sort-keys --arg build_key "$DEPENDENCY_BUILD_KEY" \
              --argjson seconds 1410 --argjson run 45989936318 \
              '{schema:1,build_key:$build_key,cold_build_seconds:$seconds,cold_build_run:$run}' \
              > "$root/record.json"
            archive="$RUNNER_TEMP/native-dependencies/macos-dependencies.tar.gz"
            config="$RUNNER_TEMP/native-dependencies/prepared.json"
            "$PREPARED_ARTIFACT_TOOL" pack-preserve-times "$root" "$archive"
            "$PREPARED_ARTIFACT_TOOL" manifest \
              bundle macos-arm64 "$DEPENDENCY_BUILD_KEY_FILE" application/gzip \
              "$archive" "$root" - "$config"
            # Publication is an optimization: a refused publication records
            # the cold build unpublished instead of failing the stage.
            manifest=-
            publication='unpublished: publication refused'
            if printf '%s' "$GHCR_TOKEN" \
              | oras login ghcr.io --username "$GITHUB_ACTOR" --password-stdin; then
              trap 'oras logout ghcr.io' EXIT
              if output=$("$PREPARED_ARTIFACT_TOOL" publish \
                "$DEPENDENCY_REPOSITORY" "$DEPENDENCY_TAG" "$config" "$archive"); then
                read -r label published <<< "$output"
                if test "$label" = published; then
                  manifest="$published"
                  publication=published
                fi
              fi
            fi
          fi
          savings=$((DEPENDENCY_BASELINE_SECONDS - DEPENDENCY_BUILD_SECONDS))
          if test "$DEPENDENCY_HIT" = 0; then
            savings=0
          fi
          {
            printf '### macOS native dependency layer\n\n'
            printf -- '- build key: `%s`\n' "$DEPENDENCY_BUILD_KEY"
            printf -- '- manifest: `%s`\n' "$manifest"
            printf -- '- cache hit: `%s`\n' "$DEPENDENCY_HIT"
            printf -- '- publication: %s\n' "$publication"
            printf -- '- native build: `%ss`\n' "$DEPENDENCY_BUILD_SECONDS"
            printf -- '- cold baseline: `%ss`\n' \
              "$([[ "$DEPENDENCY_HIT" = 1 ]] && printf '%s' "$DEPENDENCY_BASELINE_SECONDS" || printf '%s' "$DEPENDENCY_BUILD_SECONDS")"
            printf -- '- compile-time savings: `%ss`\n' "$savings"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload unsigned stage transport
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: macos-unsigned-${{ inputs.challenge }}
          path: ${{ runner.temp }}/unsigned-stage.tar.gz
          if-no-files-found: error
          retention-days: 1

      - name: Upload admitted host policy
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: macos-policy-${{ inputs.challenge }}
          path: ${{ runner.temp }}/hosted.toml
          if-no-files-found: error
          retention-days: 1

      - name: Upload credential-free finalizer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: macos-finalizer-${{ inputs.challenge }}
          path: ${{ runner.temp }}/finalizer.tar.gz
          if-no-files-found: error
          retention-days: 1

      - name: Tear down build roots
        if: always()
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/hosted-tools" "$RUNNER_TEMP/unsigned-stage" \
            "$RUNNER_TEMP/candidate-prebuild" "$RUNNER_TEMP/prepared-artifact-target"

  sign:
    name: Sign macOS
    needs: stage
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      actions: read
      contents: none
    steps:
      - name: Download unsigned stage
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: macos-unsigned-${{ inputs.challenge }}
          path: ${{ runner.temp }}/transport

      - name: Download admitted host policy
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: macos-policy-${{ inputs.challenge }}
          path: ${{ runner.temp }}/transport

      - name: Admit signing host and prepare exact input
        shell: bash
        env:
          EXPECTED_ARCHIVE: ${{ inputs.source }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/sign"
          mkdir -p "$work"
          tar -xzf "$RUNNER_TEMP/transport/unsigned-stage.tar.gz" -C "$work"
          policy="$RUNNER_TEMP/transport/hosted.toml"
          policy_value() {
            python3 - "$policy" "$1" "$2" <<'PY'
          import sys, tomllib
          with open(sys.argv[1], "rb") as source:
              policy = tomllib.load(source)
          print(policy[sys.argv[2]][sys.argv[3]])
          PY
          }
          test "$(uname -m)" = arm64
          test "$ImageOS" = "$(policy_value image provider_os)"
          test "$(sw_vers -productVersion)" = "$(policy_value image os_version)"
          test "$(sw_vers -buildVersion)" = "$(policy_value image os_build)"
          sudo xcode-select --switch "$(policy_value xcode developer_dir)"
          test "$(xcodebuild -version | sed -n '2s/^Build version //p')" = "$(policy_value xcode build)"
          test "macosx$(xcrun --sdk macosx --show-sdk-version)" = "$(policy_value xcode sdk)"
          python3 - "$work/unsigned-stage" "$work/native" "$EXPECTED_ARCHIVE" <<'PY'
          import json, os, shutil, sys
          root, output, expected_archive = sys.argv[1:]
          payload_path = os.path.join(root, "targets/aarch64-apple-darwin/payload.json")
          with open(payload_path, "rb") as source:
              payload = json.load(source)
          if payload["target"] != "aarch64-apple-darwin" or payload["archive"] != expected_archive:
              raise SystemExit("unsigned stage answers another request")
          if len(payload["inventory"]) != 2:
              raise SystemExit("unsigned stage inventory is not exact")
          entry = next(item for item in payload["inventory"] if item["path"] == "bin/spice")
          source = os.path.join(root, "objects", f"{entry['digest']}-{entry['mode']:04o}")
          if entry["mode"] != 0o755 or os.path.getsize(source) != entry["bytes"]:
              raise SystemExit("unsigned native object differs from its inventory")
          shutil.copyfile(source, output)
          os.chmod(output, 0o755)
          PY

      - name: Apply Apple credentials to exact native bytes
        shell: bash
        env:
          DEVELOPER_IDENTITY: ${{ vars.MACOS_DEVELOPER_IDENTITY }}
          DEVELOPER_ID_P12_B64: ${{ secrets.MACOS_DEVELOPER_ID_P12_B64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_P12_PASSWORD }}
          NOTARY_KEY_B64: ${{ secrets.MACOS_NOTARY_KEY_B64 }}
          NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          sign_started=$(date +%s)
          work="$RUNNER_TEMP/sign"
          native="$work/native"
          keychain="$RUNNER_TEMP/signing.keychain-db"
          p12="$RUNNER_TEMP/developer-id.p12"
          api_key="$RUNNER_TEMP/notary.p8"
          archive="$RUNNER_TEMP/native.zip"
          reply="$RUNNER_TEMP/notary.json"
          keychain_password=$(openssl rand -hex 32)
          cleanup() {
            security delete-keychain "$keychain" >/dev/null 2>&1 || true
            rm -f "$p12" "$api_key" "$archive" "$reply" "$keychain"
            keychain_password=
          }
          trap cleanup EXIT HUP INT TERM

          printf '%s' "$DEVELOPER_ID_P12_B64" | /usr/bin/base64 -D > "$p12"
          printf '%s' "$NOTARY_KEY_B64" | /usr/bin/base64 -D > "$api_key"
          chmod 0600 "$p12" "$api_key"
          security create-keychain -p "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain"
          security set-keychain-settings -lut 2700 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$p12" -k "$keychain" -P "$DEVELOPER_ID_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain"
          security find-identity -v -p codesigning "$keychain" | grep -F "\"$DEVELOPER_IDENTITY\""

          codesign --force --options runtime --timestamp --keychain "$keychain" --sign "$DEVELOPER_IDENTITY" "$native"
          codesign --verify --deep --strict --verbose=2 "$native"
          ditto -c -k --keepParent "$native" "$archive"
          xcrun notarytool submit "$archive" \
            --key "$api_key" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID" \
            --wait --output-format json > "$reply"
          python3 - "$reply" <<'PY'
          import json, sys
          with open(sys.argv[1], "rb") as source:
              reply = json.load(source)
          if reply.get("status") != "Accepted" or not reply.get("id"):
              raise SystemExit(f"notary submission refused: {reply}")
          print(f"notary submission {reply['id']} accepted")
          PY
          codesign --verify --deep --strict --verbose=2 "$native"
          spctl --assess --type open --context context:primary-signature --verbose=4 "$native"
          sign_seconds=$(($(date +%s) - sign_started))
          {
            printf '### macOS signing and notarization\n\n'
            printf -- '- signing, notarization, and assessment: `%ss`\n' "$sign_seconds"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload signed native bytes
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: macos-native-${{ inputs.challenge }}
          path: ${{ runner.temp }}/sign/native
          if-no-files-found: error
          retention-days: 1

      - name: Remove credential material
        if: always()
        shell: bash
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" >/dev/null 2>&1 || true
          rm -rf "$RUNNER_TEMP/developer-id.p12" "$RUNNER_TEMP/notary.p8" "$RUNNER_TEMP/signing.keychain-db" "$RUNNER_TEMP/native.zip" "$RUNNER_TEMP/notary.json" "$RUNNER_TEMP/sign"

  finalize:
    name: Finalize macOS
    needs: sign
    outputs:
      manifest: ${{ steps.publish.outputs.manifest }}
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      actions: read
      contents: none
      packages: write
    steps:
      - name: Download unsigned stage
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: macos-unsigned-${{ inputs.challenge }}
          path: ${{ runner.temp }}/transport

      - name: Download signed native bytes
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: macos-native-${{ inputs.challenge }}
          path: ${{ runner.temp }}/transport/native

      - name: Download credential-free finalizer
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: macos-finalizer-${{ inputs.challenge }}
          path: ${{ runner.temp }}/transport

      - name: Download canonical release input
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: input-${{ inputs.release_inputs_challenge }}
          run-id: ${{ inputs.release_inputs_run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/input

      - name: Restore exact proof source
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/input/source.tar"
          test "$(shasum -a 256 "$archive" | cut -d' ' -f1)" = '${{ inputs.archive_sha256 }}'
          find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          tar -xmf "$archive" --strip-components=1 -C "$GITHUB_WORKSPACE"
          test "$(python3 -c 'import json; print(json.load(open("dist/build.json"))["source"]["commit"])')" = '${{ inputs.source_commit }}'
          git init -q
          git config core.autocrlf false
          git config user.name spice-hosted
          git config user.email hosted@invalid
          git add -A -f -- .
          GIT_AUTHOR_DATE=2000-01-01T00:00:00Z GIT_COMMITTER_DATE=2000-01-01T00:00:00Z \
            git commit -q -m 'canonical source ${{ inputs.source_commit }}'
          test "$(git ls-tree -r -z --full-tree HEAD | shasum -a 256 | cut -d' ' -f1)" = '${{ inputs.tree }}'

      - name: Rebind, prove, and verify exact signed stage
        shell: bash
        run: |
          set -euo pipefail
          proof_started=$(date +%s)
          work="$RUNNER_TEMP/finalize"
          finalizer="$work/finalizer"
          stage="$GITHUB_WORKSPACE/dist/stage"
          mkdir -p "$work" "$finalizer"
          tar -xzf "$RUNNER_TEMP/transport/unsigned-stage.tar.gz" -C "$work"
          tar -xzf "$RUNNER_TEMP/transport/finalizer.tar.gz" -C "$finalizer"
          native="$RUNNER_TEMP/transport/native/native"
          chmod 0555 "$finalizer/xtask" "$native"
          "$finalizer/xtask" verify-staged-darwin "$work/unsigned-stage"
          "$finalizer/xtask" finalize-staged-darwin "$work/unsigned-stage" "$native" "$stage"
          "$finalizer/xtask" verify-staged-darwin "$stage"
          # The sealed runner admits only the environment build.sh pinned in the
          # stage job: the exact toolchain path, the Cargo home directory, and the
          # vendor closure below this workspace's ignored target directory.
          rustup toolchain install 1.97.1-aarch64-apple-darwin --profile minimal --no-self-update
          mkdir -p "$RUNNER_TEMP/release-cargo" "$GITHUB_WORKSPACE/target"
          mv "$finalizer/proof-native-darwin" "$GITHUB_WORKSPACE/target/proof-native-darwin"
          runner="$GITHUB_WORKSPACE/target/proof-native-darwin/bin/spice-proof-darwin-runner"
          plan=$("$native" config proof.runner "$runner" \
            | sed -n 's/^digest = "\([0-9a-f]*\)"$/\1/p')
          test -n "$plan"
          "$native" config proof.runner "$runner" --apply="$plan" >/dev/null
          "$finalizer/xtask" prove-staged-target aarch64-apple-darwin
          codesign --verify --deep --strict --verbose=2 "$native"
          notarization_attempts=30
          notarization_delay=10
          for ((attempt = 1; attempt <= notarization_attempts; attempt++)); do
            if spctl --assess --type open --context context:primary-signature --verbose=4 "$native"; then
              break
            fi
            if ((attempt == notarization_attempts)); then
              echo "notarization remained unavailable after ${notarization_attempts} attempts" >&2
              exit 1
            fi
            sleep "$notarization_delay"
          done
          python3 - \
            "$stage/result.json" \
            '${{ inputs.challenge }}' \
            '${{ inputs.source_commit }}' \
            '${{ inputs.source }}' \
            '${{ inputs.archive_sha256 }}' \
            '${{ inputs.release_inputs_run }}' \
            '${{ inputs.release_inputs_challenge }}' \
            '${{ inputs.tree }}' \
            '${{ inputs.app }}' \
            '${{ inputs.canvas }}' \
            "$GITHUB_RUN_ID" "$ImageOS" "$ImageVersion" "$(uname -m)" \
            '${{ inputs.proof_container }}' <<'PY'
          import json, sys
          output, challenge, source_commit, source, archive_sha256, release_inputs_run, release_inputs_challenge, tree, app, canvas, run_id, image_os, image_version, architecture, proof_container = sys.argv[1:]
          result = {
              "challenge": challenge, "source_commit": source_commit, "source": source,
              "archive_sha256": archive_sha256, "release_inputs_run": int(release_inputs_run),
              "release_inputs_challenge": release_inputs_challenge, "tree": tree,
              "app": app, "canvas": canvas, "run_id": int(run_id), "image_os": image_os,
              "image_version": image_version, "architecture": architecture,
              "proof_container": proof_container,
          }
          with open(output, "w", encoding="utf-8", newline="\n") as destination:
              json.dump(result, destination, sort_keys=True, separators=(",", ":"))
              destination.write("\n")
          PY
          result="$RUNNER_TEMP/result"
          mkdir -p "$result/stage"
          mv "$stage/result.json" "$result/result.json"
          cp -R "$stage/." "$result/stage/"
          (cd "$result" && find . -type f ! -path ./subjects.json | sed 's|^\./||' \
            | LC_ALL=C sort | jq -R . | jq -cs .) > "$result/subjects.json"
          proof_seconds=$(($(date +%s) - proof_started))
          {
            printf '### macOS signed proof\n\n'
            printf -- '- finalization, native proof, and assessment: `%ss`\n' "$proof_seconds"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install exact ORAS
        uses: oras-project/setup-oras@ac735097e22fe643015b0d19645f7c9a69942128
        with:
          version: 1.3.0

      - name: Publish finalized macOS bundle
        id: publish
        shell: bash
        env:
          GHCR_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          PREPARED_BUILD_KEY: ${{ inputs.prepared_build_key }}
          PREPARED_INPUTS: ${{ inputs.prepared_inputs }}
        run: |
          set -euo pipefail
          prepared="$RUNNER_TEMP/prepared"
          mkdir -p "$prepared"
          printf '%s' "$PREPARED_INPUTS" > "$prepared/build-key.json"
          xtask="$RUNNER_TEMP/finalize/finalizer/xtask"
          "$xtask" prepared-artifact pack "$RUNNER_TEMP/result" "$prepared/macos-stage.tar.gz"
          "$xtask" prepared-artifact manifest \
            bundle macos-arm64 "$prepared/build-key.json" application/gzip \
            "$prepared/macos-stage.tar.gz" "$RUNNER_TEMP/result" - "$prepared/prepared.json"
          key="${PREPARED_BUILD_KEY#sha256:}"
          test "${#key}" -eq 64
          # An exact rerun signs again into different bytes, so each attempt
          # publishes beneath its own discovery tag.
          tag=$(printf '%s:%s' "$key" "$GITHUB_RUN_ATTEMPT" | shasum -a 256 | cut -d' ' -f1)
          repository=$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
          repository="ghcr.io/$repository/prepared"
          printf '%s' "$GHCR_TOKEN" | oras login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          read -r label manifest < <(
            "$xtask" prepared-artifact publish \
              "$repository" "$tag" \
              "$prepared/prepared.json" "$prepared/macos-stage.tar.gz"
          )
          test "$label" = published
          [[ "$manifest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "manifest=$manifest" >> "$GITHUB_OUTPUT"
          oras logout ghcr.io

  attest:
    name: Attest macOS
    needs: finalize
    runs-on: macos-15
    timeout-minutes: 15
    permissions:
      actions: read
      attestations: write
      id-token: write
      packages: read
    steps:
      - name: Download credential-free bundle client
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: macos-finalizer-${{ inputs.challenge }}
          path: ${{ runner.temp }}/transport

      - name: Install exact ORAS
        uses: oras-project/setup-oras@ac735097e22fe643015b0d19645f7c9a69942128
        with:
          version: 1.3.0

      - name: Fetch immutable finalized bundle
        shell: bash
        env:
          GHCR_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          PREPARED_BUILD_KEY: ${{ inputs.prepared_build_key }}
          PREPARED_INPUTS: ${{ inputs.prepared_inputs }}
          PREPARED_MANIFEST: ${{ needs.finalize.outputs.manifest }}
        run: |
          set -euo pipefail
          tools="$RUNNER_TEMP/tools"
          prepared="$RUNNER_TEMP/prepared"
          mkdir -p "$tools" "$prepared"
          tar -xzf "$RUNNER_TEMP/transport/finalizer.tar.gz" -C "$tools"
          xtask="$tools/xtask"
          printf '%s' "$PREPARED_INPUTS" > "$prepared/build-key.json"
          [[ "$PREPARED_MANIFEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          repository=$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
          repository="ghcr.io/$repository/prepared"
          printf '%s' "$GHCR_TOKEN" | oras login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          "$xtask" prepared-artifact fetch \
            "$repository@$PREPARED_MANIFEST" "$PREPARED_BUILD_KEY" "$prepared/pulled"
          mkdir "$RUNNER_TEMP/result"
          tar -xzf "$prepared/pulled/macos-stage.tar.gz" -C "$RUNNER_TEMP/result"
          "$xtask" prepared-artifact admit-tree \
            "$prepared/pulled/prepared.json" "$RUNNER_TEMP/result"
          oras logout ghcr.io

      - name: Require the declared attestation subjects
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/result"
          test "$(cd "$root" && find . -type f ! -path ./subjects.json | sed 's|^\./||' \
            | LC_ALL=C sort | jq -R . | jq -cs .)" = "$(jq -c . "$root/subjects.json")"

      - name: Attest complete hosted artifact
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a
        with:
          subject-path: ${{ runner.temp }}/result/**
