name: Input staging
run-name: Input staging ${{ inputs.challenge }}

on:
  workflow_dispatch:
    inputs:
      challenge:
        description: Unique lowercase 64-hex release-input challenge
        required: true
        type: string
      source_commit:
        description: Exact landed main commit to archive and compile
        required: true
        type: string

permissions: {}

jobs:
  stage:
    name: Stage input
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
    steps:
      - name: Check out exact landed source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.source_commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Admit request and landed commit
        env:
          CHALLENGE: ${{ inputs.challenge }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          set -euo pipefail
          [[ "$CHALLENGE" =~ ^[0-9a-f]{64}$ ]]
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$GITHUB_REF" == refs/heads/main ]]
          [[ "$(git rev-parse HEAD)" == "$SOURCE_COMMIT" ]]
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor "$SOURCE_COMMIT" refs/remotes/origin/main
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      # Derivable bootstrap state only: the pinned app compiler, registry
      # sources, and the debug xtask target. Every hit is re-admitted below by
      # the exact trunk version and Cargo's own freshness checks; release
      # outputs are never cached.
      - name: Restore derivable bootstrap environment
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: |
            ${{ runner.temp }}/bootstrap-cargo
            ${{ runner.temp }}/bootstrap-target
          key: input-bootstrap-${{ runner.os }}-${{ runner.arch }}-trunk-0.22.1-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', '.cargo/config.toml') }}

      - name: Install exact Rust and app compiler
        env:
          CARGO_HOME: ${{ runner.temp }}/bootstrap-cargo
        run: |
          set -euo pipefail
          rustup toolchain install --no-self-update
          cargo install --locked trunk --version 0.22.1
          test "$("$CARGO_HOME/bin/trunk" --version)" = "trunk 0.22.1"
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"

      - name: Install exact ORAS
        uses: oras-project/setup-oras@ac735097e22fe643015b0d19645f7c9a69942128
        with:
          version: 1.3.0

      - name: Build repository-owned producer
        env:
          CARGO_HOME: ${{ runner.temp }}/bootstrap-cargo
          CARGO_TARGET_DIR: ${{ runner.temp }}/bootstrap-target
        run: cargo build --locked --package xtask

      - name: Build canonical source archive and app canvas
        env:
          CARGO_HOME: ${{ runner.temp }}/bootstrap-cargo
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/bootstrap-target/debug/xtask" release-inputs \
            "$RUNNER_TEMP/input"

      - name: Resolve admitted proof image
        id: proof
        env:
          GHCR_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/prepared"
          mkdir -p "$root"
          xtask="$RUNNER_TEMP/bootstrap-target/debug/xtask"
          jq -n \
            --arg cargo_lock "sha256:$(sha256sum Cargo.lock | cut -d' ' -f1)" \
            --arg cargo_config "sha256:$(sha256sum .cargo/config.toml | cut -d' ' -f1)" \
            --arg rust_toolchain "sha256:$(sha256sum rust-toolchain.toml | cut -d' ' -f1)" \
            --arg proof_image "sha256:$(git ls-tree -r -z HEAD -- dist/proof-image proof vendor-set xtask/src/proof_image.rs | sha256sum | cut -d' ' -f1)" \
            --arg contract "sha256:$(git ls-tree -r -z HEAD -- .github/workflows/proof-image.yml prepared wire/src/manifest.rs xtask/Cargo.toml xtask/src/lib.rs xtask/src/main.rs xtask/src/prepared_artifact.rs | sha256sum | cut -d' ' -f1)" \
            '{cargo_lock:$cargo_lock,cargo_config:$cargo_config,rust_toolchain:$rust_toolchain,proof_image:$proof_image,contract:$contract}' \
            > "$root/build-key.json"
          key="$($xtask prepared-artifact build-key "$root/build-key.json" | sed -n 's/^build key sha256://p')"
          [[ "$key" =~ ^[0-9a-f]{64}$ ]]
          printf '%s' "$GHCR_TOKEN" | oras login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          "$xtask" prepared-artifact resolve \
            "ghcr.io/${GITHUB_REPOSITORY,,}/prepared:$key" "sha256:$key" \
            | tee "$root/resolve.out"
          read -r label manifest payload identity < "$root/resolve.out"
          test "$label" = resolved
          [[ "$manifest" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$payload" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$identity" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "build_key=sha256:$key" >> "$GITHUB_OUTPUT"
          echo "manifest=$manifest" >> "$GITHUB_OUTPUT"
          echo "payload=$payload" >> "$GITHUB_OUTPUT"
          echo "identity=$identity" >> "$GITHUB_OUTPUT"
          oras logout ghcr.io
      - name: Record immutable producer result
        env:
          CHALLENGE: ${{ inputs.challenge }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          PROOF_BUILD_KEY: ${{ steps.proof.outputs.build_key }}
          PROOF_MANIFEST: ${{ steps.proof.outputs.manifest }}
          PROOF_IDENTITY: ${{ steps.proof.outputs.identity }}
          PROOF_ARCHIVE_SHA256: ${{ steps.proof.outputs.payload }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/input"
          archive_tree="$RUNNER_TEMP/archive-tree"
          mkdir "$archive_tree"
          tar -xf "$root/source.tar" -C "$archive_tree"
          git -C "$archive_tree/spice" init -q
          git -C "$archive_tree/spice" config core.autocrlf false
          git -C "$archive_tree/spice" add -A -f -- .
          tree_id="$(git -C "$archive_tree/spice" write-tree)"
          tree="$(git -C "$archive_tree/spice" ls-tree -r -z --full-tree "$tree_id" | sha256sum | cut -d' ' -f1)"
          jq \
            --arg challenge "$CHALLENGE" \
            --arg source_commit "$SOURCE_COMMIT" \
            --arg tree "$tree" \
            --arg proof_build_key "$PROOF_BUILD_KEY" \
            --arg proof_manifest "$PROOF_MANIFEST" \
            --arg proof_identity "$PROOF_IDENTITY" \
            --arg proof_archive_sha256 "${PROOF_ARCHIVE_SHA256#sha256:}" \
            --arg workflow ".github/workflows/input.yml" \
            --arg workflow_ref "$GITHUB_WORKFLOW_REF" \
            --arg workflow_sha "$GITHUB_WORKFLOW_SHA" \
            --argjson run_id "$GITHUB_RUN_ID" \
            --arg image_os "$ImageOS" \
            --arg image_version "$ImageVersion" \
            --arg architecture "$RUNNER_ARCH" \
            --arg rustc "$(rustc --version)" \
            --arg cargo "$(cargo --version)" \
            --arg trunk "$(trunk --version)" \
            '. + {
              challenge: $challenge,
              source_commit: $source_commit,
              tree: $tree,
              proof_build_key: $proof_build_key,
              proof_manifest: $proof_manifest,
              proof_identity: $proof_identity,
              proof_archive_sha256: $proof_archive_sha256,
              workflow: $workflow,
              workflow_ref: $workflow_ref,
              workflow_sha: $workflow_sha,
              run_id: $run_id,
              runner: {image_os: $image_os, image_version: $image_version, architecture: $architecture},
              toolchain: {rustc: $rustc, cargo: $cargo, trunk: $trunk}
            }' "$root/producer.json" > "$root/result.json"
          test "$(jq -r .source_commit "$root/result.json")" = "$SOURCE_COMMIT"
          rm "$root/producer.json"

      - name: Publish canonical release inputs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: input-${{ inputs.challenge }}
          path: |
            ${{ runner.temp }}/input/source.tar
            ${{ runner.temp }}/input/canvas.zip
            ${{ runner.temp }}/input/result.json
          if-no-files-found: error
          retention-days: 7


  attest:
    name: Attest input
    needs: stage
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      attestations: write
      id-token: write
    steps:
      - name: Download input
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: input-${{ inputs.challenge }}
          path: ${{ runner.temp }}/input

      - name: Attest archive, canvas, and producer result
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a
        with:
          subject-path: |
            ${{ runner.temp }}/input/source.tar
            ${{ runner.temp }}/input/canvas.zip
            ${{ runner.temp }}/input/result.json
