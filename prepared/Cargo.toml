[package]
name = "prepared-artifact"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
[features]
windows-proof = ["dep:proof", "dep:wire"]


[dependencies]
flate2.workspace = true
getrandom = "0.3.4"
proof = { path = "../proof", optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
tar = "0.4.44"
zip = { version = "9.3", default-features = false, features = ["deflate"] }
vendor-set = { path = "../vendor-set" }
wire = { path = "../wire", optional = true }

[target.'cfg(all(target_arch = "aarch64", not(target_env = "msvc")))'.dependencies]
sha2 = { version = "0.10.9", features = ["asm"] }

[lints]
workspace = true
