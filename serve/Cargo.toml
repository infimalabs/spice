[package]
name = "serve"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
atomic = { path = "../atomic" }
bus = { path = "../bus" }
journal = { path = "../journal" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
wire = { path = "../wire" }

[dev-dependencies]
tempfile = "3.27.0"
test-support = { path = "../test-support" }
tokio = { version = "1.53.1", features = ["time"] }
tokio-tungstenite = "0.29.0"
toml = "1.1.4"
tungstenite = "0.29.0"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "original-uri", "tokio", "ws"] }
base64 = "0.22.1"
constant_time_eq = "0.4.2"
futures-util = { version = "0.3.33", default-features = false, features = ["sink", "std"] }
flate2.workspace = true
rack = { path = "../rack", features = ["write"] }
sha2 = "0.10.9"
sill = { path = "../sill" }
tokio = { version = "1.53.1", features = ["io-util", "macros", "net", "process", "rt", "sync", "time"] }
tokio-util = { version = "0.7.14", default-features = false, features = ["rt"] }

# Hardware SHA-256 on aarch64; see wire/Cargo.toml.
[target.'cfg(all(target_arch = "aarch64", not(target_env = "msvc")))'.dependencies]
sha2 = { version = "0.10.9", features = ["asm"] }

[lints]
workspace = true
