[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spice-harness"
version = "0.30.0"
description = "Spice Harness: an agent harness / fleet operations console for coding repositories; its task plane requires Taskwarrior 3."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "lizard>=1.21",
    "ruff>=0.11",
    "tree-sitter>=0.25.2",
    "tree-sitter-c-sharp>=0.23.5",
    "tree-sitter-javascript>=0.25.0",
    "watchfiles>=1.1",
]

[project.urls]
Homepage = "https://github.com/infimalabs/spice"
Repository = "https://github.com/infimalabs/spice"
Issues = "https://github.com/infimalabs/spice/issues"

[project.scripts]
spice = "spice.cli.entry:main"
spice-judge = "spice.agent.judgeadapter:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["spice*"]
namespaces = true

[tool.setuptools.package-data]
"spice" = ["spice.toml"]
"spice.agent" = [
    "*.md",
    "shellhooks/.zshenv",
    "shellhooks/.zprofile",
    "shellhooks/.zshrc",
    "shellhooks/.zlogin",
    "shellhooks/bash_env",
    "staticshellhooks/.zshenv",
    "staticshellhooks/.zprofile",
    "staticshellhooks/.zshrc",
    "staticshellhooks/.zlogin",
    "staticshellhooks/bash_env",
]
"spice.serve.static" = [
    "*.css",
    "*.js",
    "*.ico",
    "*.png",
    "*.svg",
    "*.webmanifest",
    "icons/*.svg",
]
"spice.tasks.graphs" = ["*.js"]

[dependency-groups]
# build, setuptools, twine and wheel drive the release proof's artifact chain,
# so they are pinned to the exact versions release-proof/toolchain.json
# declares -- the host run and the container run must agree byte-for-byte on
# the packaging toolchain, and the rehearsal's preflight refuses any drift.
dev = [
    "build==1.3.0",
    "pyright>=1.1",
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "pytest-xdist>=3.6",
    "setuptools==80.9.0",
    "twine==6.1.0",
    "wheel==0.45.1",
]

[tool.pyright]
include = ["spice"]
typeCheckingMode = "standard"
pythonVersion = "3.12"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-n", "auto", "--dist=loadfile"]
