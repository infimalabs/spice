[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spice-harness"
version = "0.26.0"
description = "Spice Harness: an agent harness / fleet operations console for coding repositories."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "lizard>=1.21",
    "ruff>=0.11",
    "tree-sitter>=0.25.2",
    "tree-sitter-c-sharp>=0.23.5",
    "tree-sitter-javascript>=0.25.0",
    "watchfiles>=1.1",
]

[project.urls]
Homepage = "https://github.com/infimalabs/spice"
Repository = "https://github.com/infimalabs/spice"
Issues = "https://github.com/infimalabs/spice/issues"

[project.scripts]
spice = "spice.cli.entry:main"
spice-judge = "spice.agent.judgeadapter:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["spice*"]
namespaces = true

[tool.setuptools.package-data]
"spice" = ["spice.toml"]
"spice.agent" = [
    "*.md",
    "shellhooks/.zshenv",
    "shellhooks/.zprofile",
    "shellhooks/.zshrc",
    "shellhooks/.zlogin",
    "shellhooks/bash_env",
    "staticshellhooks/.zshenv",
    "staticshellhooks/.zprofile",
    "staticshellhooks/.zshrc",
    "staticshellhooks/.zlogin",
    "staticshellhooks/bash_env",
]
"spice.serve.static" = [
    "*.css",
    "*.js",
    "*.ico",
    "*.png",
    "*.svg",
    "*.webmanifest",
    "icons/*.svg",
]
"spice.tasks.graphs" = ["*.js"]

[dependency-groups]
# build, setuptools, twine and wheel drive the release proof's artifact chain,
# so they are pinned to the exact versions release-proof/toolchain.json
# declares -- the host run and the container run must agree byte-for-byte on
# the packaging toolchain, and the rehearsal's preflight refuses any drift.
dev = [
    "build==1.3.0",
    "pyright>=1.1",
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "pytest-xdist>=3.6",
    "setuptools==80.9.0",
    "twine==6.1.0",
    "wheel==0.45.1",
]

[tool.pyright]
include = ["spice"]
typeCheckingMode = "standard"
pythonVersion = "3.12"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-n", "auto", "--dist=loadfile"]

[tool.spice.agent]
wrappers = ["common", "spice-dev"]

# Opt this repository (only) into local maxim adjudication: the judge drops
# heuristic false positives before a reminder publishes. The packaged default
# stays judge-free, so other installs are unaffected.
[tool.spice.judge]
enabled = true

[tool.spice.wrappers.spice-dev.pre-commit]
argv = ["spice", "dev", "pre-commit"]

[tool.spice.wrappers.spice-dev.pytest]
argv = ["spice", "dev", "pytest"]

# The "common" group is inherited from the layered global default. It owns all
# grep and RTK behavior, including driver-scoped extended-regexp defaults. The
# repository-local spice-dev group contains only this checkout's development
# commands.

[tool.spice.tasks]
stems = ["session", "mail", "hooks", "studies", "cli", "lifecycle", "tests"]

[tool.spice.policy]
env_names = [
    "BASH_ENV",
    "CLAUDE_CODE_AUTO_COMPACT_WINDOW",
    "CLAUDE_CODE_SESSION_ID",
    "CLAUDE_CONFIG_DIR",
    "COVERAGE_FILE",
    "CODEX_HOME",
    "CODEX_SESSION_TURN_ID",
    "CODEX_THREAD_ID",
    "CODEX_TURN_ID",
    "GIT_CONFIG_COUNT",
    "GIT_CONFIG_KEY_0",
    "GIT_CONFIG_SYSTEM",
    "GIT_CONFIG_VALUE_0",
    "GIT_EDITOR",
    "GIT_SSH_COMMAND",
    "GIT_TERMINAL_PROMPT",
    "HISTFILE",
    "HOME",
    "FAKEENV_OK",
    "PATH",
    "FAKEENV_PORT",
    "PROBE_LANES",
    "PROBE_ROUNDS",
    "PROBE_SUBMITS",
    "PYTHONDONTWRITEBYTECODE",
    "PYTHONPYCACHEPREFIX",
    "PYTHONPATH",
    "RTK_DB_PATH",
    "TASKRC",
    "SPICE_AGENT_BIN",
    "SPICE_AGENT_DRIVER",
    "SPICE_GIT_TIMEOUT_SECONDS",
    "SPICE_JUDGE_MODEL_CMD",
    "SPICE_JUDGE_TIMEOUT",
    "SPICE_METRIC_HISTORY_RETENTION_DAYS",
    "SPICE_MOUNTED_COMMAND",
    "SPICE_PLAYWRIGHT_MCP_CONFIG",
    "SPICE_RELEASE_BROWSER_REPORT",
    "SPICE_SELFEXEC_ROOT",
    "SPICE_SERVE_BIN",
    "SPICE_SHELL_HOOK_ORIGINAL_BASH_ENV",
    "SPICE_SHELL_HOOK_ORIGINAL_HISTFILE",
    "SPICE_SHELL_HOOK_ORIGINAL_ZDOTDIR",
    "SPICE_SHELL_HOOK_REPO_ROOT",
    "SPICE_SHELL_HOOK_WRAPPERS",
    "SPICE_SQLITE_LIFECYCLE_AUDIT",
    "SPICE_STAGED_PATHS",
    "SPICE_TASK_BACKEND",
    "SPICE_TEST_TRACE",
    "SPICE_VISIBLE_PROG",
    "FAKEENV_THIRD_BIN",
    "FAKEENV_THIRD_THREAD_ID",
    "FAKEENV_THIRD_TURN_ID",
    "FAKEENV_TLS",
    "TZ",
    "UV_PUBLISH_TOKEN",
    "VIRTUAL_ENV",
    "FAKEENV_X",
    "ZDOTDIR",
    "ZSH_COMPDUMP",
]

# A task landing that touches one of these paths runs the whole suite on the
# merged tree before it publishes. No commit is gated on any of this.
#
# Membership is measured, not felt, and the measurement is
# `spice study suite-seam-reach`, which fixes the two terms it turns on: a test
# module is a collected test_*.py file under the configured test roots, and
# reach follows imports wherever they appear, including inside function bodies,
# because a deferred import binds two modules just as tightly once the process
# runs. Measured that way, every path below belongs to a leading band: the
# narrowest declared path still reaches more test modules than the widest path
# left undeclared. The live command is the source of the point-in-time counts;
# copying them here would let this explanation drift whenever the test graph
# grows. test_this_repository_declares_exactly_the_widest_reaching_modules
# holds the break and prints the ranking when it moves. The gap between that
# reach and a lane's own view of its change is the whole problem:
# spice/tasks/tw.py can be named directly by only a small slice of the suite
# while remaining in the transitively reached band, so on 2026-07-22 a lane
# verified 120 task tests, believed that covered it, and landed a red branch
# anyway.
#
# Cost when it fires: `seconds` below, measured at 125s / 81s / 196s across
# three runs on this checkout, paid once by the landing rather than by any
# commit. Every other landing pays one path comparison. Browser smokes stay
# out: they need `npm ci`, which is a release-time dependency.
[tool.spice.policy.suite_seam]
seconds = 200
run = ["spice", "dev", "pytest", "-q", "--ignore=tests/browser"]
paths = [
    "spice/agent/driver.py",
    "spice/agent/identity.py",
    "spice/agent/paths.py",
    "spice/config/layers.py",
    "spice/config/values.py",
    "spice/defaultinventory.py",
    "spice/defaults.py",
    "spice/errors.py",
    "spice/extensions.py",
    "spice/hooks/commitmsg.py",
    "spice/locking.py",
    "spice/mail/steeringkey.py",
    "spice/pathmatch.py",
    "spice/paths.py",
    "spice/policy.py",
    "spice/policyconfig.py",
    "spice/process/git.py",
    "spice/process/groups.py",
    "spice/process/tool.py",
    "spice/scopes.py",
    "spice/sqliteconnection.py",
    "spice/tasks/config.py",
    "spice/tasks/identity.py",
    "spice/tasks/tw.py",
]

# Low-value words this repo rejects, merged over the built-in defaults
# (hallucinate). Empty value = "consider rephrasing".
[tool.spice.policy.taste.words]
smell = ""

# The agent-run fast path deliberately bypasses the full CLI dispatcher so it
# never imports the parser/inbox stack; asserting the bypass is inherently about
# internal control flow and has no public observable.
[[tool.spice.policy.internal_couplings]]
path = "tests/test_agentrun.py"
test = "test_agent_run_dispatch_bypasses_full_parser_and_inbox_import"
target = "_dispatch"

# Mount-routing precedence is decided inside the CLI dispatcher; this test
# exercises that internal routing branch directly.
[[tool.spice.policy.internal_couplings]]
path = "tests/test_mounts.py"
test = "test_dispatch_prefers_dotted_mount_before_builtin_parse"
target = "_dispatch"

# _existing_watch_paths is the pre-registration filter to paths that exist on
# disk; the live bus exposes no public accessor for that intermediate set.
[[tool.spice.policy.internal_couplings]]
path = "tests/test_livebusevents.py"
test = "test_existing_watch_paths_returns_existing_input_paths"
target = "_existing_watch_paths"

# _kqueue is the OS-level kevent handle; verifying it re-registers only when
# the watched-path set changes is inherently white-box.
[[tool.spice.policy.internal_couplings]]
path = "tests/test_livebusevents.py"
test = "test_kqueue_watch_rearms_only_when_watched_paths_change"
target = "_kqueue"

# The watchfiles adapter owns the activation callback around the public
# generator; this white-box test pins activation after its native-ready yield.
[[tool.spice.policy.internal_couplings]]
path = "tests/test_livebusevents.py"
test = "test_watchfiles_activation_follows_native_ready_yield"
target = "_wait_for_change_watchfiles"

# The dev-gate worktree-checkout re-exec has no public observable besides its
# subprocess side effect; these assert directly on the private resolver/gate
# functions to pin the no-op vs. relaunch decision white-box.
[[tool.spice.policy.internal_couplings]]
path = "tests/test_selfexec.py"
test = "test_reexec_noop_when_already_running_from_the_local_venv"
target = "_reexec_dev_command_for_worktree_checkout"

[[tool.spice.policy.internal_couplings]]
path = "tests/test_selfexec.py"
test = "test_reexec_noop_when_cwd_is_not_a_spice_checkout"
target = "_reexec_dev_command_for_worktree_checkout"

[[tool.spice.policy.internal_couplings]]
path = "tests/test_selfexec.py"
test = "test_reexec_sentinel_prevents_a_relaunch_loop"
target = "_reexec_dev_command_for_worktree_checkout"

[[tool.spice.policy.internal_couplings]]
path = "tests/test_selfexec.py"
test = "test_worktree_local_python_none_without_spice_package"
target = "_worktree_local_python"

[[tool.spice.policy.internal_couplings]]
path = "tests/test_selfexec.py"
test = "test_worktree_local_python_none_without_venv"
target = "_worktree_local_python"

# _worktree_dirty is a lifecycle git probe reached only by the private
# uncaptured-lane nudge; its stall contract (resolve to clean, so a wedged
# `git status` never fabricates a dirty-tree nudge) has no public observable,
# so the bound-deadline test pins it white-box.
[[tool.spice.policy.internal_couplings]]
path = "tests/test_boundedwaits.py"
test = "test_worktree_dirty_bounds_probe_and_resolves_clean_status_on_stall"
target = "_worktree_dirty"

# _close_quietly is the bytecode purge's descriptor-teardown boundary; its
# contract is that a failing close produces no observable effect at all, so
# the EBADF double-close probe is inherently white-box.
[[tool.spice.policy.internal_couplings]]
path = "tests/test_gitsyncbytecode.py"
test = "test_close_quietly_contains_descriptor_teardown_failure"
target = "_close_quietly"

[tool.spice.serve]
brand = "spice"

[tool.spice.commands]
release = ["uv", "run", "python", "-m", "spice.release"]
